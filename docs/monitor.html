<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cazador de Oportunidades - JARASOFT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --s1:#0a0b10;--s2:#0f1018;--s3:#141520;
  --border:#1c1d2c;--border2:#242538;
  --text:#e2e4f0;--muted:#6b6d87;--dim:#3d3f55;
  --green:#2dd4a0;--gbg:#0a2820;--red:#f05060;--rbg:#2a0c10;
  --amber:#f0b840;--abg:#281e08;--blue:#60a8f0;--bbg:#0a1828;
  --mono:'JetBrains Mono',monospace;--sans:'DM Sans',sans-serif;
}
html,body{background:#000}
html{color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{padding:24px 16px 48px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:19px;font-weight:700;line-height:1.2}
h1 span{display:block;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--dim);letter-spacing:.16em;margin-top:4px}
.sub{color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
button{background:var(--s3);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:11px;font-weight:600;padding:9px 14px;border-radius:8px;cursor:pointer}
button:active{background:var(--border2)}
input{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:13px 14px;color:var(--text);font-size:16px;outline:none;font-family:inherit;margin-bottom:20px}
input:focus{border-color:var(--border2)}

.sl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:12px;padding-left:2px}
.idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:11px;margin-bottom:26px}
.idx{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:13px}
.idx-n{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.idx-p{font-family:var(--mono);font-size:19px;font-weight:700;margin:5px 0 2px}
.idx-c{font-family:var(--mono);font-size:11px;font-weight:600}
.idx-x{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:6px}

.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:var(--s2);border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:10px;font-weight:600;padding:7px 13px;border-radius:20px;cursor:pointer;letter-spacing:.04em}
.tab.on{background:var(--gbg);border-color:#1a4028;color:var(--green)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.tk{font-family:var(--mono);font-size:17px;font-weight:700}
.nm{font-size:11px;color:var(--muted);margin-top:2px}
.pr{font-family:var(--mono);font-size:14px;color:var(--text);margin-top:5px}
.chip{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.04em;padding:4px 9px;border-radius:20px;white-space:nowrap;border:1px solid}
.barbg{height:6px;background:var(--s3);border-radius:3px;position:relative;overflow:hidden;margin-top:10px}
.barfill{height:100%;border-radius:3px;position:absolute}
.sv{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:6px}
.mf{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;padding:4px 0;color:var(--muted)}
.mf b{color:var(--text);font-weight:600}
.cardfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:11px;margin-top:9px;border-top:1px solid var(--border)}
.rb{font-family:var(--mono);font-size:9px;font-weight:600;padding:3px 8px;border-radius:4px;border:1px solid}

/* ---- Reporte ---- */
.ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.ph-tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);margin-bottom:4px;text-transform:uppercase}
.ph-title{font-size:17px;font-weight:700}
.ph-right{text-align:right}
.ph-date{font-family:var(--mono);font-size:10px;color:var(--muted)}
.sbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:15px 18px;background:var(--s2);border:1px solid var(--border);border-radius:10px;margin-bottom:22px}
.bdiv{width:1px;height:36px;background:var(--border2)}
.sm{text-align:center}
.sm .v{font-family:var(--mono);font-size:13px;font-weight:600}
.sm .l{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
.ml{margin-left:auto;text-align:right}
.gw{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.gsw{position:relative;flex-shrink:0}
.gc{position:absolute;top:58%;left:50%;transform:translate(-50%,-50%);text-align:center}
.gs{font-family:var(--mono);font-size:31px;font-weight:700;line-height:1}
.gl{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:4px;letter-spacing:.08em}
.gm{flex:1;min-width:230px}
.gm h2{font-size:15px;font-weight:600;margin-bottom:7px}
.gm p{font-size:12.5px;color:var(--muted);line-height:1.68}
.gm p b{color:var(--text)}
.gv{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:6px 14px;border-radius:4px;margin-top:11px;border:1px solid}
.kstrip{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:24px;grid-template-columns:repeat(6,1fr)}
.kstrip.k5{grid-template-columns:repeat(5,1fr)}
@media(max-width:640px){.kstrip,.kstrip.k5{grid-template-columns:repeat(3,1fr)}}
.ki{background:var(--s1);padding:13px 11px}
.ki .kl{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.ki .kv{font-family:var(--mono);font-size:14px;font-weight:600}
.ki .ks{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:3px}
.cb{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:17px 15px 11px;margin-bottom:24px}
.ct{font-size:12.5px;font-weight:600;margin-bottom:3px}
.cs{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
@media(max-width:580px){.g3{grid-template-columns:1fr 1fr}}
.mc{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:13px;position:relative;overflow:hidden}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.mct{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:6px}
.mcn{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.mcb{font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 7px;border-radius:3px;white-space:nowrap}
.mcv{font-family:var(--mono);font-size:18px;font-weight:700;margin-bottom:3px}
.mno{font-size:11px;color:var(--muted);line-height:1.5}
.sb{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:24px}
.sb h3{font-size:13px;font-weight:600;margin-bottom:14px}
.sbr{margin-bottom:14px}
.sbr:last-child{margin-bottom:0}
.sbh{display:flex;justify-content:space-between;margin-bottom:5px}
.sbn{font-family:var(--mono);font-size:11px}
.sbs{font-family:var(--mono);font-size:11px;font-weight:600}
.sbbar{height:7px;background:var(--s3);border-radius:4px;overflow:hidden}
.sbf{height:100%;border-radius:4px}
.sbi{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.sbit{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:3px}
.qt{background:var(--s2);border:1px solid var(--border);border-radius:10px;overflow-x:auto;margin-bottom:24px}
table{width:100%;border-collapse:collapse;min-width:560px}
thead tr{background:var(--s3)}
th{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;padding:11px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
td{font-family:var(--mono);font-size:11px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:none}
.trh{background:rgba(45,212,160,.05)}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
@media(max-width:640px){.dual{grid-template-columns:1fr}}
.dc{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:18px}
.dc h3{font-size:12px;font-weight:600;margin-bottom:12px}
.dc ul{list-style:none}
.dc ul li{font-size:12px;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--border);line-height:1.55;display:flex;gap:8px}
.dc ul li:last-child{border-bottom:none}
.dc ul li::before{flex-shrink:0;font-size:10px;margin-top:2px}
.cat ul li::before{content:'▲';color:var(--green)}
.ris ul li::before{content:'▼';color:var(--red)}
.vb{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:24px}
.vb h3{font-size:13px;font-weight:600;margin-bottom:15px}
.rtrack{display:flex;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--border2)}
.rseg{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.04em;text-align:center;padding:0 2px}
.r-active{outline:2px solid #fff;outline-offset:-2px;opacity:1!important}
.niv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
@media(max-width:540px){.niv{grid-template-columns:1fr 1fr}}
.nivc{text-align:center;padding:10px;background:var(--s3);border-radius:6px}
.nivc .ev{font-family:var(--mono);font-size:14px;font-weight:600}
.nivc .el{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:4px}
.vt{font-size:12.5px;color:var(--muted);line-height:1.72;border-top:1px solid var(--border);padding-top:15px;margin-top:6px}
.vt b{color:var(--text)}
.rfooter{font-family:var(--mono);font-size:9px;color:var(--dim);border-top:1px solid var(--border);padding-top:14px;line-height:1.8;margin-top:8px}
.msg{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px;line-height:1.7}
.err{background:var(--rbg);border:1px solid #4a1218;color:#fca5a5;padding:14px;border-radius:10px;font-size:13px}
.volver{margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap}
.star{background:none;border:none;color:var(--dim);font-size:19px;line-height:1;padding:2px 4px;cursor:pointer;flex-shrink:0}
.star.on{color:var(--amber)}
.chtop{display:flex;align-items:flex-start;gap:6px}
.viva{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:3px;background:var(--gbg);color:var(--green);white-space:nowrap}
.nota{background:var(--s2);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:8px;padding:12px 14px;margin-bottom:18px;font-size:12px;color:var(--muted);line-height:1.6}
.nota b{color:var(--text)}
.nota code{font-family:var(--mono);font-size:11px;color:var(--amber)}
.wlbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Cazador de Oportunidades<span>JARASOFT</span></h1>
      <div class="sub" id="sub">Cargando...</div>
    </div>
    <button onclick="cargar()">↻ Actualizar</button>
  </div>
  <input id="busq" placeholder="Busca un ticker o empresa (ej. NVDA, WALMEX, Apple)..." oninput="buscar(this.value)" autocomplete="off">
  <div id="cont"><div class="msg">Cargando datos...</div></div>
</div>

<script>
const URL_JSON = "https://jrjara13.github.io/monitor-alertas/alertas.json";
const URL_RAPIDO = "https://jrjara13.github.io/monitor-alertas/rapido.json";
const CLAVE_WL = "jarasoft_watchlist";
const CS = {"COMPRA FUERTE":"#2dd4a0","COMPRA":"#2dd4a0","MANTENER / OBSERVAR":"#6b6d87","VENTA":"#f05060","VENTA FUERTE":"#f05060"};
const CR = {Bajo:"#2dd4a0",Medio:"#f0b840",Alto:"#f05060"};
const VERDE="#2dd4a0",ROJO="#f05060",AMBAR="#f0b840",AZUL="#60a8f0",GRIS="#6b6d87";

let datos=null,indices=null,fechaDatos="",filtro="",vista="watch",detalle=null;
let wlLocal=[],wlRapido=[],fechaRapido="";

function leerWL(){
  try{const v=localStorage.getItem(CLAVE_WL);wlLocal=v?JSON.parse(v):[];}
  catch(e){wlLocal=[];}
  if(!Array.isArray(wlLocal))wlLocal=[];
}
function guardarWL(){
  try{localStorage.setItem(CLAVE_WL,JSON.stringify(wlLocal));}
  catch(e){console.warn("No se pudo guardar el watchlist:",e);}
}
function enWL(t){return wlLocal.indexOf(t)>=0;}
function toggleWL(t,ev){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  const i=wlLocal.indexOf(t);
  if(i>=0)wlLocal.splice(i,1); else wlLocal.push(t);
  guardarWL(); render();
}
function wlUnion(){return [...new Set([...wlRapido,...wlLocal])];}
function copiarWL(){
  const lista=wlUnion();
  const txt="# Watchlist — una emisora por línea.\n"+
    "# Se actualizan cada 5 minutos en horario de mercado.\n"+lista.join("\n")+"\n";
  const ok=()=>{const b=document.getElementById("btncopiar");if(b){b.textContent="✓ Copiado";setTimeout(()=>b.textContent="Copiar lista para watchlist.txt",2200);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(()=>alert(txt));
  }else alert(txt);
}

const fmt=(v,d=2)=>typeof v==="number"?v.toFixed(d):"—";
const pct=v=>typeof v==="number"?(v>=0?"+":"")+v.toFixed(2)+"%":"—";
const pc1=v=>typeof v==="number"?(v*100).toFixed(1)+"%":"—";
const colr=v=>typeof v!=="number"?GRIS:v>0?VERDE:v<0?ROJO:GRIS;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dol=v=>typeof v==="number"?"$"+fmt(v):"—";

function cap(n){
  if(typeof n!=="number")return "—";
  if(n>=1e12)return "$"+(n/1e12).toFixed(2)+"T";
  if(n>=1e9)return "$"+(n/1e9).toFixed(1)+"B";
  if(n>=1e6)return "$"+(n/1e6).toFixed(0)+"M";
  return "$"+n;
}
function miles(n){
  if(typeof n!=="number")return "—";
  const s=n<0?"-":"";n=Math.abs(n);
  if(n>=1e9)return s+"$"+(n/1e9).toFixed(2)+"B";
  if(n>=1e6)return s+"$"+(n/1e6).toFixed(1)+"M";
  return s+"$"+n.toFixed(0);
}

function leerFecha(s){
  if(!s)return "—";
  const d=new Date(String(s).replace(/\.(\d{3})\d+/,".$1"));
  return isNaN(d)?"—":d.toLocaleString("es-MX");
}

async function cargar(){
  leerWL();
  document.getElementById("sub").textContent="Cargando...";
  try{
    const r=await fetch(URL_JSON+"?t="+Date.now());
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    datos=j.tickers||j; indices=j.indices||{};
    fechaDatos=leerFecha(j.actualizado);

    try{
      const rr=await fetch(URL_RAPIDO+"?t="+Date.now());
      if(rr.ok){
        const jr=await rr.json();
        wlRapido=jr.watchlist||[];
        fechaRapido=leerFecha(jr.actualizado);
        if(jr.tickers)for(const [t,v] of Object.entries(jr.tickers))datos[t]=v;
        if(jr.indices&&Object.keys(jr.indices).length)indices=jr.indices;
      }
    }catch(e){}

    document.getElementById("sub").textContent=
      Object.keys(datos).length+" EMISORAS · "+fechaDatos+
      (fechaRapido?" · WATCHLIST "+fechaRapido:"");
    render();
  }catch(e){
    document.getElementById("sub").textContent="Error";
    document.getElementById("cont").innerHTML='<div class="err">No se pudieron cargar los datos: '+esc(e.message)+'</div>';
  }
}
function buscar(v){filtro=v.trim();detalle=null;render();}
function cambiarVista(v){vista=v;render();}
function abrir(t){detalle=t;window.scrollTo(0,0);render();}
function cerrar(){detalle=null;render();}

function media(s,n){const o=[];for(let i=0;i<s.length;i++){if(i<n-1){o.push(null);continue;}let x=0;for(let k=i-n+1;k<=i;k++)x+=s[k];o.push(x/n);}return o;}

function sparkline(serie,color,w=160,h=32){
  const s=(serie||[]).filter(v=>typeof v==="number");
  if(s.length<2)return "";
  const mn=Math.min(...s),mx=Math.max(...s),rg=mx-mn||1;
  const pts=s.map((v,i)=>(i/(s.length-1)*w).toFixed(1)+","+(h-(v-mn)/rg*h).toFixed(1)).join(" ");
  return '<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="display:block;margin-top:8px"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.6"/></svg>';
}

function graficoCompleto(serie,niv,pt){
  const s=(serie||[]).filter(v=>typeof v==="number");
  if(s.length<25)return '<div class="mno">Sin historial suficiente para graficar.</div>';
  const W=820,H=210,pL=52,pR=14,pT=20,pB=28,cW=W-pL-pR,cH=H-pT-pB;
  const m20=media(s,20),m50=media(s,50);
  let all=s.concat(m20.filter(v=>v!=null),m50.filter(v=>v!=null));
  if(typeof pt==="number")all=all.concat([pt]);
  const mn=Math.min(...all)*0.98,mx=Math.max(...all)*1.02,rg=mx-mn||1;
  const X=i=>(pL+i/(s.length-1)*cW).toFixed(1), Y=v=>(pT+cH-(v-mn)/rg*cH).toFixed(1);
  let h="";
  for(let i=0;i<=4;i++){const v=mn+i/4*rg,y=Y(v);
    h+='<line x1="'+pL+'" y1="'+y+'" x2="'+(W-pR)+'" y2="'+y+'" stroke="#141520"/>';
    h+='<text x="'+(pL-5)+'" y="'+(+y+3)+'" font-family="JetBrains Mono" font-size="9" fill="#6b6d87" text-anchor="end">$'+v.toFixed(0)+'</text>';}
  if(typeof pt==="number"&&pt>mn&&pt<mx){
    h+='<line x1="'+pL+'" y1="'+Y(pt)+'" x2="'+(W-pR)+'" y2="'+Y(pt)+'" stroke="'+AMBAR+'" stroke-width="1" stroke-dasharray="2,4" opacity=".7"/>';
    h+='<text x="'+(pL+5)+'" y="'+(Y(pt)-4)+'" font-family="JetBrains Mono" font-size="8" fill="'+AMBAR+'">PT CONSENSO $'+fmt(pt)+'</text>';}
  const li=(a,c,w2)=>{const p=a.map((v,i)=>v==null?null:X(i)+","+Y(v)).filter(Boolean).join(" ");
    return p?'<polyline points="'+p+'" fill="none" stroke="'+c+'" stroke-width="'+w2+'"/>':"";};
  const sube=s[s.length-1]>=s[0],col=sube?VERDE:ROJO;
  const area=X(0)+","+(pT+cH)+" "+s.map((v,i)=>X(i)+","+Y(v)).join(" ")+" "+X(s.length-1)+","+(pT+cH);
  h+='<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+col+'"/><stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>';
  h+='<polygon points="'+area+'" fill="url(#lg)" opacity=".13"/>';
  h+=li(s,col,2)+li(m20,AZUL,1.2)+li(m50,AMBAR,1.2);
  h+='<circle cx="'+X(s.length-1)+'" cy="'+Y(s[s.length-1])+'" r="4" fill="'+col+'"/>';
  h+='<text x="'+(pL+6)+'" y="'+(pT+10)+'" font-family="JetBrains Mono" font-size="8" fill="'+col+'">— Precio</text>';
  h+='<text x="'+(pL+70)+'" y="'+(pT+10)+'" font-family="JetBrains Mono" font-size="8" fill="'+AZUL+'">— SMA 20</text>';
  h+='<text x="'+(pL+140)+'" y="'+(pT+10)+'" font-family="JetBrains Mono" font-size="8" fill="'+AMBAR+'">— SMA 50</text>';
  return '<svg width="100%" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="display:block">'+h+'</svg>';
}

function render(){
  if(!datos)return;
  const cont=document.getElementById("cont");
  if(detalle&&datos[detalle]){cont.innerHTML=reporte(detalle,datos[detalle]);return;}
  if(filtro){
    const f=filtro.toLowerCase();
    const hits=Object.entries(datos).filter(([t,r])=>t.toLowerCase().includes(f)||(r.nombre||"").toLowerCase().includes(f));
    if(!hits.length){cont.innerHTML='<div class="msg">Sin resultados para "'+esc(filtro)+'".<br>El universo cubre S&P 500, NASDAQ-100 y BMV. Para emisoras de BMV usa el sufijo .MX (ej. WALMEX.MX).</div>';return;}
    if(hits.length===1){cont.innerHTML=reporte(hits[0][0],hits[0][1]);return;}
    hits.sort((a,b)=>b[1].compuesto.score_compuesto-a[1].compuesto.score_compuesto);
    cont.innerHTML='<div class="sl">'+hits.length+' coincidencias — toca una para abrir su reporte</div><div class="grid">'+hits.slice(0,60).map(([t,r])=>card(t,r)).join("")+'</div>';
    return;
  }
  const todos=Object.entries(datos);
  const compra=todos.filter(([,r])=>r.compuesto.señal.includes("COMPRA"));
  const venta=todos.filter(([,r])=>r.compuesto.señal.includes("VENTA"));
  const union=wlUnion();
  let h='<div class="sl">Mercados en este momento</div><div class="idx-grid">'+Object.values(indices||{}).map(idxCard).join("")+'</div>';
  h+='<div class="sl">Señales activas</div><div class="tabs">'+
     tab("watch","★ MI WATCHLIST ("+union.length+")")+
     tab("compra","COMPRAS ("+compra.length+")")+tab("venta","VENTAS ("+venta.length+")")+
     tab("riesgo","COMPRAS BAJO RIESGO")+'</div>';

  if(vista==="watch"){
    const soloLocal=wlLocal.filter(t=>wlRapido.indexOf(t)<0);
    h+='<div class="wlbar"><button id="btncopiar" onclick="copiarWL()">Copiar lista para watchlist.txt</button></div>';
    if(soloLocal.length){
      h+='<div class="nota"><b>'+soloLocal.length+' emisora'+(soloLocal.length>1?'s':'')+
         ' marcada'+(soloLocal.length>1?'s':'')+' solo en este dispositivo</b> ('+soloLocal.map(esc).join(", ")+
         '): se actualizan cada 30 minutos con el universo completo. Para que entren al refresco de 5 minutos, '+
         'copia la lista con el botón de arriba y pégala en <code>watchlist.txt</code> en tu repositorio de GitHub.</div>';
    }
    const filas=union.map(t=>[t,datos[t]]).filter(([,r])=>r);
    const faltan=union.filter(t=>!datos[t]);
    if(!filas.length){
      h+='<div class="msg">Tu watchlist está vacío.<br>Toca la estrella ☆ en cualquier emisora para agregarla.</div>';
    }else{
      filas.sort((a,b)=>b[1].compuesto.score_compuesto-a[1].compuesto.score_compuesto);
      h+='<div class="grid">'+filas.map(([t,r])=>card(t,r)).join("")+'</div>';
    }
    if(faltan.length)h+='<div class="msg">Sin datos disponibles para: '+faltan.map(esc).join(", ")+
      '. Puede que el símbolo no exista en la fuente o esté fuera del universo analizado.</div>';
    cont.innerHTML=h;
    return;
  }

  let lista;
  if(vista==="compra")lista=compra.sort((a,b)=>b[1].compuesto.score_compuesto-a[1].compuesto.score_compuesto);
  else if(vista==="venta")lista=venta.sort((a,b)=>a[1].compuesto.score_compuesto-b[1].compuesto.score_compuesto);
  else lista=compra.filter(([,r])=>r.riesgo.nivel_riesgo==="Bajo").sort((a,b)=>b[1].compuesto.score_compuesto-a[1].compuesto.score_compuesto);
  h+=lista.length?'<div class="grid">'+lista.slice(0,12).map(([t,r])=>card(t,r)).join("")+'</div>'+(lista.length>12?'<div class="msg">Mostrando 12 de '+lista.length+'. Usa el buscador para abrir cualquier emisora.</div>':''):'<div class="msg">Sin resultados en esta vista.</div>';
  cont.innerHTML=h;
}

    '<div class="idx-c" style="color:'+c+'">'+pct(x.cambio_1d)+'</div>'+sparkline(x.serie,c)+

    '<div><div class="tk">'+esc(t)+'</div>'+(r.nombre?'<div class="nm">'+esc(r.nombre)+'</div>':'')+'</div></div>'+
    '<div class="pr">'+dol(r.tecnico.precio_actual)+' '+rapido+'</div></div>'+

    '<div style="margin-top:8px">'+mf("RSI (14)",fmt(r.tecnico.rsi,1))+mf("P/E",fmt(r.fundamental.pe,1))+mf("3 meses",pct((r.rendimiento||{}).m3))+'</div>'+

function gauge(score){
  const p=Math.max(0,Math.min(100,score))/100, ang=Math.PI*(1-p);
  const x=(100+80*Math.cos(ang)).toFixed(1), y=(100-80*Math.sin(ang)).toFixed(1);
  return '<svg width="200" height="115" viewBox="0 0 200 115">'+
    '<defs><linearGradient id="gG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="'+VERDE+'"/><stop offset="50%" stop-color="'+AMBAR+'"/><stop offset="100%" stop-color="'+ROJO+'"/></linearGradient></defs>'+
    '<path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#141520" stroke-width="16" stroke-linecap="round"/>'+
    '<path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="url(#gG)" stroke-width="16" stroke-linecap="round" opacity=".18"/>'+
    (p>0.01?'<path d="M 20 100 A 80 80 0 0 1 '+x+' '+y+'" fill="none" stroke="url(#gG)" stroke-width="16" stroke-linecap="round"/>':'')+
    '<line x1="100" y1="100" x2="'+x+'" y2="'+y+'" stroke="#e2e4f0" stroke-width="2" stroke-linecap="round" opacity=".85"/>'+
    '<circle cx="100" cy="100" r="5" fill="#e2e4f0"/>'+
    '<text x="16" y="112" font-family="JetBrains Mono" font-size="9" fill="#6b6d87">0</text>'+
    '<text x="91" y="18" font-family="JetBrains Mono" font-size="9" fill="#6b6d87">50</text>'+
    '<text x="178" y="112" font-family="JetBrains Mono" font-size="9" fill="#6b6d87">100</text></svg>';
}

    });
    h+='</tbody></table><div style="font-family:var(--mono);font-size:9px;color:var(--dim);padding:8px 12px">Estados financieros trimestrales según los reporta la fuente. La variación anual compara contra el mismo trimestre del año previo.</div></div>';
  }

  h+=desgloseScore(r);

  const fav=factoresFavor(r),con=factoresContra(r);
  h+='<div class="sl">Factores a Favor y en Contra · Derivados de las Métricas</div><div class="dual">'+
     '<div class="dc cat"><h3 style="color:'+VERDE+'">▲ FACTORES A FAVOR</h3><ul>'+
     (fav.length?fav.map(x=>'<li>'+x+'</li>').join(""):'<li>Sin factores positivos destacables en las métricas actuales.</li>')+'</ul></div>'+
     '<div class="dc ris"><h3 style="color:'+ROJO+'">▼ FACTORES EN CONTRA</h3><ul>'+

  h+='<div class="rfooter">'+esc(t)+' · Reporte generado automáticamente por Cazador de Oportunidades · JARASOFT · Datos: Yahoo Finance · '+esc(fechaDatos)+'<br>'+
     'NO CONSTITUYE ASESORÍA DE INVERSIÓN. Herramienta de apoyo cuantitativo basada en reglas fijas. Las señales deben interpretarse junto con su propio análisis y el perfil del cliente.</div>';
  return h;

function ki(l,v,s,col){
  return '<div class="ki"><div class="kl">'+l+'</div><div class="kv" style="color:'+(col||"var(--text)")+'">'+v+'</div>'+
    '<div class="ks">'+(s||"&nbsp;")+'</div></div>';

function tituloGauge(rg,comp){
  const n=rg.nivel_riesgo;
  const t=comp.señal.includes("COMPRA")?"Señal de Compra":comp.señal.includes("VENTA")?"Señal de Venta":"Sin Señal Direccional";
  return "Riesgo "+n+" · "+t;
}
function etiquetaSenal(r){
  const tp=r.tecnico.score_tecnico>0,fp=r.fundamental.score_fundamental>0;
  if(tp&&fp)return "TÉCNICO Y FUNDAMENTAL ALINEADOS";
  if(tp&&!fp)return "MOMENTUM SIN RESPALDO FUNDAMENTAL";
  if(!tp&&fp)return "FUNDAMENTALES SÓLIDOS, TÉCNICO DÉBIL";
  return "DEBILIDAD EN AMBOS FRENTES";
}
function resumenGauge(r){
  const rg=r.riesgo,tc=r.tecnico,fu=r.fundamental,sc=r.compuesto.score_compuesto;
  let s="Score de riesgo <b>"+fmt(rg.score_riesgo,1)+"/100 ("+rg.nivel_riesgo+")</b>: volatilidad anual de "+
    fmt(rg.volatilidad_anualizada,1)+"%, caída máxima de "+fmt(rg.max_drawdown,1)+"% en los últimos doce meses y beta de "+
    fmt(rg.beta,2)+". ";
  s+="El score compuesto de <b>"+(sc>=0?"+":"")+sc+"</b> resulta de un bloque técnico de "+tc.score_tecnico+
    "/4 y uno fundamental de "+fu.score_fundamental+"/6, con la penalización por riesgo aplicada. ";
  if(typeof fu.pe==="number")
    s+="El P/E de "+fmt(fu.pe,1)+"× "+(fu.pe<15?"es bajo frente al promedio del mercado.":fu.pe>35?"es exigente y descuenta crecimiento elevado sostenido.":"se ubica en rango razonable.");
  return s;
}
function tituloGrafico(tc){
  const p=tc.precio_actual;
  if(typeof p!=="number"||typeof tc.sma20!=="number"||typeof tc.sma50!=="number")return "Evolución del precio con medias móviles";
  if(p>tc.sma20&&tc.sma20>tc.sma50)return "Precio sobre SMA20 y SMA50, con las medias alineadas al alza — estructura alcista";
  if(p<tc.sma20&&tc.sma20<tc.sma50)return "Precio bajo SMA20 y SMA50, con las medias alineadas a la baja — estructura bajista";
  return "Precio y medias móviles sin alineación clara — tendencia en transición";
}

function tarjetasValuacion(fu,rg,upside){
  let h="";
  h+=mcard("P/U Trailing",typeof fu.pe!=="number"?"SIN DATO":fu.pe<0?"PÉRDIDAS":fu.pe<15?"BAJO":fu.pe>35?"EXIGENTE":"RAZONABLE",
    typeof fu.pe!=="number"?GRIS:fu.pe<0?ROJO:fu.pe<15?VERDE:fu.pe>35?AMBAR:VERDE,
    typeof fu.pe==="number"?fmt(fu.pe,1)+"×":"—",
    typeof fu.pe!=="number"?"Sin dato disponible en la fuente para esta emisora.":
    fu.pe<0?"La empresa reporta pérdidas; el múltiplo de utilidades no es interpretable.":
    fu.pe<15?"Múltiplo por debajo del promedio del mercado.":
    fu.pe>35?"Múltiplo por encima del promedio. Descuenta continuidad del crecimiento; una desaceleración lo comprimiría con rapidez.":
    "Múltiplo en rango intermedio frente al promedio del mercado.");
  h+=mcard("PEG",typeof fu.peg!=="number"?"SIN DATO":fu.peg<1?"FAVORABLE":fu.peg>2?"CARO":"NEUTRAL",
    typeof fu.peg!=="number"?GRIS:fu.peg<1?VERDE:fu.peg>2?ROJO:AMBAR,
    typeof fu.peg==="number"?fmt(fu.peg,2)+"×":"—",
    typeof fu.peg!=="number"?"Sin dato disponible.":
    fu.peg<1?"Por debajo de 1: ajustado por su tasa de crecimiento, el múltiplo deja de verse caro.":
    fu.peg>2?"Por encima de 2: el precio pagado supera con holgura el crecimiento esperado.":
    "Cerca de 1: el múltiplo guarda proporción con el crecimiento esperado.");
  h+=mcard("PT Consenso",typeof upside!=="number"?"SIN DATO":upside>0?pct(upside)+" UPSIDE":pct(upside)+" DOWNSIDE",
    typeof upside!=="number"?GRIS:upside>0?VERDE:ROJO,
    typeof fu.precio_objetivo==="number"?dol(fu.precio_objetivo):"—",
    typeof fu.precio_objetivo!=="number"?"Sin cobertura de analistas registrada en la fuente.":
    "Precio objetivo promedio de analistas"+(fu.num_analistas?" ("+fu.num_analistas+" opiniones)":"")+". Implica un recorrido de "+pct(upside)+" desde el nivel actual.");
  h+=mcard("Rentabilidad",typeof fu.margen_operativo!=="number"?"SIN DATO":fu.margen_operativo>0.2?"MUY ALTA":fu.margen_operativo<0.05?"ESTRECHA":"INTERMEDIA",
    typeof fu.margen_operativo!=="number"?GRIS:fu.margen_operativo>0.2?VERDE:fu.margen_operativo<0.05?ROJO:AMBAR,
    pc1(fu.margen_operativo),
    "Margen operativo"+(typeof fu.roe==="number"?", con ROE de "+pc1(fu.roe):"")+". "+
    (typeof fu.margen_operativo!=="number"?"Sin dato disponible.":
     fu.margen_operativo>0.2?"Indica poder de fijación de precios y apalancamiento operativo.":
     fu.margen_operativo<0.05?"Poco colchón ante aumentos de costos o presión competitiva.":
     "Rentabilidad en línea con el promedio del mercado."));
  h+=mcard("Apalancamiento",typeof fu.deuda_capital!=="number"?"SIN DATO":fu.deuda_capital<50?"BAJO":fu.deuda_capital>150?"ELEVADO":"MODERADO",
    typeof fu.deuda_capital!=="number"?GRIS:fu.deuda_capital<50?VERDE:fu.deuda_capital>150?ROJO:AMBAR,
    typeof fu.deuda_capital==="number"?fmt(fu.deuda_capital,1):"—",
    "Deuda sobre capital. "+(typeof fu.deuda_capital!=="number"?"Sin dato disponible.":
     fu.deuda_capital<50?"Balance poco apalancado: baja sensibilidad al ciclo de tasas.":
     fu.deuda_capital>150?"Apalancamiento elevado: amplifica el riesgo financiero y la sensibilidad a tasas.":
     "Nivel de deuda manejable frente al capital contable."));
  h+=mcard("Volatilidad",rg.volatilidad_anualizada>45?"ELEVADA":rg.volatilidad_anualizada<20?"CONTENIDA":"MEDIA",
    rg.volatilidad_anualizada>45?ROJO:rg.volatilidad_anualizada<20?VERDE:AMBAR,
    fmt(rg.volatilidad_anualizada,1)+"%",
    "Anualizada. Con beta de "+fmt(rg.beta,2)+" y caída máxima de "+fmt(rg.max_drawdown,1)+
    "%, "+(rg.volatilidad_anualizada>45?"requiere dimensionar la posición con cuidado.":"el perfil de fluctuación es manejable."));
  return h;
}

function desgloseScore(r){
  const tc=r.tecnico,fu=r.fundamental,rg=r.riesgo;
  const st=tc.señales||{},sf=fu.señales||{};
  const et=(k,l)=>{const v=st[k];if(v===undefined)return "";
    const col=v>0?VERDE:v<0?ROJO:AMBAR;
    return '<span class="sbit" style="background:'+col+'1a;color:'+col+'">'+l+' · '+(v>0?"+1":v<0?"−1":"0")+'</span>';};
  const ef=(k,l)=>{const v=sf[k];if(v===undefined)return "";
    const col=v>0?VERDE:v<0?ROJO:AMBAR;
    return '<span class="sbit" style="background:'+col+'1a;color:'+col+'">'+l+' · '+(v>0?"+1":v<0?"−1":"0")+'</span>';};
  const pctT=(tc.score_tecnico+4)/8*100, pctF=(fu.score_fundamental+6)/12*100, pctR=100-rg.score_riesgo;
  const colT=tc.score_tecnico>0?VERDE:tc.score_tecnico<0?ROJO:AMBAR;
  const colF=fu.score_fundamental>0?VERDE:fu.score_fundamental<0?ROJO:AMBAR;
  const colR=CR[rg.nivel_riesgo]||AMBAR;
  return '<div class="sl">Desglose del Score</div><div class="sb">'+
    '<h3>Componentes del Score Compuesto — 45% técnico · 40% fundamental · 15% penalización por riesgo</h3>'+
    '<div class="sbr"><div class="sbh"><div class="sbn">BLOQUE TÉCNICO</div><div class="sbs" style="color:'+colT+'">'+
    tc.score_tecnico+' / 4</div></div><div class="sbbar"><div class="sbf" style="width:'+pctT+'%;background:'+colT+'"></div></div>'+
    '<div class="sbi">'+et("rsi","RSI")+et("macd","MACD")+et("tendencia","Tendencia SMA")+et("bollinger","Bollinger")+'</div></div>'+
    '<div class="sbr"><div class="sbh"><div class="sbn">BLOQUE FUNDAMENTAL</div><div class="sbs" style="color:'+colF+'">'+
    fu.score_fundamental+' / 6</div></div><div class="sbbar"><div class="sbf" style="width:'+pctF+'%;background:'+colF+'"></div></div>'+
    '<div class="sbi">'+ef("pe","P/E")+ef("peg","PEG")+ef("margen","Margen")+ef("crecimiento","Crecimiento")+ef("roe","ROE")+ef("deuda","Deuda")+
    (Object.keys(sf).length?"":'<span class="sbit" style="background:'+GRIS+'1a;color:'+GRIS+'">Fundamentales aún no disponibles</span>')+'</div></div>'+
    '<div class="sbr"><div class="sbh"><div class="sbn">PENALIZACIÓN POR RIESGO</div><div class="sbs" style="color:'+colR+'">'+
    fmt(rg.score_riesgo,1)+' / 100</div></div><div class="sbbar"><div class="sbf" style="width:'+pctR+'%;background:'+colR+'"></div></div>'+
    '<div class="sbi"><span class="sbit" style="background:'+colR+'1a;color:'+colR+'">Volatilidad '+fmt(rg.volatilidad_anualizada,1)+'% · 35%</span>'+
    '<span class="sbit" style="background:'+colR+'1a;color:'+colR+'">Drawdown '+fmt(rg.max_drawdown,1)+'% · 30%</span>'+
    '<span class="sbit" style="background:'+colR+'1a;color:'+colR+'">Beta '+fmt(rg.beta,2)+' · 20%</span>'+
    '<span class="sbit" style="background:'+colR+'1a;color:'+colR+'">ATR '+fmt(rg.atr_relativo,2)+'% · 15%</span></div></div></div>';
}

function factoresFavor(r){
  const tc=r.tecnico,fu=r.fundamental,rg=r.riesgo,rd=r.rendimiento||{},f=[];
  const p=tc.precio_actual;
  if(typeof p==="number"&&typeof tc.sma20==="number"&&typeof tc.sma50==="number"&&p>tc.sma20&&tc.sma20>tc.sma50)
    f.push("Estructura técnica alcista: el precio cotiza sobre sus medias de 20 y 50 días, con las medias alineadas al alza — configuración que suele acompañar continuidad de tendencia");
  if(typeof p==="number"&&typeof tc.sma200==="number"&&p>tc.sma200)
    f.push("Se mantiene sobre la media de 200 días ("+dol(tc.sma200)+"), referencia habitual de tendencia alcista de largo plazo");
  if(typeof tc.macd_hist==="number"&&tc.macd_hist>0)
    f.push("Histograma MACD positivo: el momentum de corto plazo sigue vigente");
  if(typeof tc.rsi==="number"&&tc.rsi<30)
    f.push("RSI en "+fmt(tc.rsi,1)+" indica sobreventa: el papel ha caído con fuerza y podría rebotar técnicamente");
  if(typeof fu.crecimiento_ingresos==="number"&&fu.crecimiento_ingresos>0.15)
    f.push("Crecimiento de ingresos de "+pc1(fu.crecimiento_ingresos)+" anual"+
      (typeof fu.margen_operativo==="number"&&fu.margen_operativo>0.2?" con margen operativo de "+pc1(fu.margen_operativo)+": crecer a esa velocidad sin sacrificar rentabilidad indica poder de fijación de precios":""));
  if(typeof fu.peg==="number"&&fu.peg<1)
    f.push("PEG de "+fmt(fu.peg,2)+"×: ajustado por crecimiento, el múltiplo deja de ser caro"+(typeof fu.pe==="number"?" pese al P/E de "+fmt(fu.pe,1)+"×":""));
  if(typeof fu.pe==="number"&&fu.pe>0&&fu.pe<15)
    f.push("P/E de "+fmt(fu.pe,1)+"×, por debajo del promedio del mercado");
  if(typeof fu.roe==="number"&&fu.roe>0.15)
    f.push("ROE de "+pc1(fu.roe)+": retorno sobre capital en el rango alto del mercado");
  if(typeof fu.deuda_capital==="number"&&fu.deuda_capital<50)
    f.push("Deuda/Capital de "+fmt(fu.deuda_capital,1)+": balance sin apalancamiento relevante, baja sensibilidad al ciclo de tasas");
  if(typeof rd.vs_sp500_3m==="number"&&rd.vs_sp500_3m>0)
    f.push("Supera al S&P 500 por "+fmt(rd.vs_sp500_3m,1)+" puntos porcentuales en tres meses: fuerza relativa positiva frente al mercado");
  if(typeof fu.precio_objetivo==="number"&&typeof p==="number"&&fu.precio_objetivo>p)
    f.push("Precio objetivo de consenso en "+dol(fu.precio_objetivo)+", "+pct((fu.precio_objetivo/p-1)*100)+" sobre el nivel actual");
  if(rg.nivel_riesgo==="Bajo")
    f.push("Perfil de riesgo bajo: volatilidad de "+fmt(rg.volatilidad_anualizada,1)+"% y beta de "+fmt(rg.beta,2)+" implican fluctuación contenida");
  if(typeof tc.volumen_relativo==="number"&&tc.volumen_relativo>1.5)
    f.push("Volumen reciente "+fmt(tc.volumen_relativo,1)+"× su promedio: interés inusual que suele acompañar movimientos relevantes");
  return f;
}

function factoresContra(r){
  const tc=r.tecnico,fu=r.fundamental,rg=r.riesgo,rd=r.rendimiento||{},f=[];
  const p=tc.precio_actual;
  if(typeof p==="number"&&typeof tc.sma20==="number"&&typeof tc.sma50==="number"&&p<tc.sma20&&tc.sma20<tc.sma50)
    f.push("Estructura técnica bajista: el precio cotiza bajo sus medias de 20 y 50 días, con las medias alineadas a la baja");
  if(typeof p==="number"&&typeof tc.sma200==="number"&&p<tc.sma200)
    f.push("Cotiza bajo la media de 200 días ("+dol(tc.sma200)+"), lo que suele leerse como debilidad de largo plazo");
  if(typeof tc.macd_hist==="number"&&tc.macd_hist<0)
    f.push("Histograma MACD negativo: el momentum de corto plazo es bajista");
  if(typeof tc.rsi==="number"&&tc.rsi>70)
    f.push("RSI en "+fmt(tc.rsi,1)+" indica sobrecompra: el avance ha sido rápido y el margen antes de una corrección se estrecha");
  else if(typeof tc.rsi==="number"&&tc.rsi>60)
    f.push("RSI en "+fmt(tc.rsi,1)+" se acerca a la zona alta: sin ser sobrecompra, el margen de avance se reduce");
  if(typeof fu.pe==="number"&&fu.pe>35)
    f.push("P/E de "+fmt(fu.pe,1)+"× descuenta la continuidad del crecimiento actual: un trimestre de desaceleración comprimiría el múltiplo de forma desproporcionada");
  if(typeof fu.pe==="number"&&fu.pe<0)
    f.push("La empresa reporta pérdidas: sin utilidades, la valuación depende enteramente de expectativas futuras");
  if(typeof fu.crecimiento_ingresos==="number"&&fu.crecimiento_ingresos<0)
    f.push("Los ingresos se contraen "+pc1(fu.crecimiento_ingresos)+" anual: señal de deterioro operativo");
  if(typeof fu.margen_operativo==="number"&&fu.margen_operativo<0.05)
    f.push("Margen operativo de "+pc1(fu.margen_operativo)+": poco colchón ante aumentos de costos o presión competitiva");
  if(typeof fu.deuda_capital==="number"&&fu.deuda_capital>150)
    f.push("Deuda/Capital de "+fmt(fu.deuda_capital,1)+": apalancamiento elevado que amplifica el riesgo financiero y la sensibilidad a tasas");
  if(rg.volatilidad_anualizada>40)
    f.push("Volatilidad anualizada de "+fmt(rg.volatilidad_anualizada,1)+"%, muy por encima del promedio del mercado — exige dimensionar la posición con cuidado");
  if(typeof rg.beta==="number"&&rg.beta>1.3)
    f.push("Beta de "+fmt(rg.beta,2)+": en una corrección del mercado, la caída esperada es sustancialmente mayor que la del índice");
  if(typeof rg.max_drawdown==="number"&&rg.max_drawdown<-25)
    f.push("Caída máxima de "+fmt(rg.max_drawdown,1)+"% en los últimos doce meses: el papel ya demostró capacidad de retrocesos profundos");
  if(typeof rd.vs_sp500_3m==="number"&&rd.vs_sp500_3m<0)
    f.push("Queda "+fmt(Math.abs(rd.vs_sp500_3m),1)+" puntos porcentuales por debajo del S&P 500 en tres meses: fuerza relativa negativa");
  if(typeof fu.precio_objetivo==="number"&&typeof p==="number"&&fu.precio_objetivo<p)
    f.push("El precio cotiza por encima del objetivo de consenso ("+dol(fu.precio_objetivo)+"): el mercado ya descontó el recorrido estimado por los analistas");
  if(!Object.keys(fu.señales||{}).length)
    f.push("Los datos fundamentales de esta emisora aún no están disponibles: la señal se apoya únicamente en el bloque técnico y de riesgo");
  return f;
}

function veredicto(t,r){
  const tc=r.tecnico,fu=r.fundamental,rg=r.riesgo,nv=r.niveles||{},rd=r.rendimiento||{};
  const sc=r.compuesto.score_compuesto,señal=r.compuesto.señal,c=CS[señal]||GRIS;
  const p=tc.precio_actual;
  const segs=[["VENTA FUERTE","#3d0c14",ROJO,1.5],["VENTA","#2a0c10",ROJO,1],
              ["MANTENER / OBSERVAR","#1e2010","#b0c060",1.2],["COMPRA","#0e2a1e",VERDE,1],["COMPRA FUERTE","#040e06",VERDE,1.5]];
  let track='<div class="rtrack">';
  segs.forEach(([n,bg,col,fl])=>{
    const act=n===señal;
    track+='<div class="rseg'+(act?' r-active':'')+'" style="flex:'+fl+';background:'+bg+';color:'+col+';opacity:'+(act?1:.4)+'">'+n+'</div>';
  });
  track+='</div>';

  const stopPct=(typeof p==="number"&&typeof nv.s2==="number")?(nv.s2/p-1)*100:null;
  const vecesATR=(typeof stopPct==="number"&&rg.atr_relativo)?Math.abs(stopPct)/rg.atr_relativo:null;

  let txt='<b>Señal: '+esc(señal)+', con score compuesto de '+(sc>=0?"+":"")+sc+' sobre ±100.</b> ';
  txt+='La lectura combina tres bloques: el técnico aporta '+tc.score_tecnico+'/4, el fundamental '+fu.score_fundamental+'/6, ';
  txt+='y el riesgo penaliza con '+fmt(rg.score_riesgo,1)+'/100 ('+rg.nivel_riesgo.toLowerCase()+'). ';
  txt+=(typeof rd.vs_sp500_3m==="number"?
    (rd.vs_sp500_3m>0?'Frente al mercado, la emisora supera al S&P 500 en '+fmt(rd.vs_sp500_3m,1)+' pp a tres meses. ':
     'Frente al mercado, la emisora queda '+fmt(Math.abs(rd.vs_sp500_3m),1)+' pp por debajo del S&P 500 a tres meses. '):'');
  txt+='<br><br>';

  if(señal.includes("COMPRA")&&typeof nv.s1==="number"&&typeof p==="number"){
    txt+='<b>Zona de acumulación técnica: '+dol(nv.s1)+' – '+dol(p)+'</b>, entre el soporte de 20 días y el precio actual. ';
    if(typeof nv.s2==="number"){
      txt+='Un retroceso hacia el soporte de 60 días ('+dol(nv.s2)+') invalidaría la estructura alcista de corto plazo. ';
      txt+='<b>Referencia de stop: cierre sostenido por debajo de '+dol(nv.s2)+'</b>'+
        (typeof stopPct==="number"?', equivalente a '+fmt(stopPct,1)+'% desde el nivel actual':'')+
        (vecesATR?' y aproximadamente '+fmt(vecesATR,1)+' veces el ATR diario':'')+'. ';
    }
  }else if(señal.includes("VENTA")&&typeof nv.r1==="number"){
    txt+='<b>Resistencia inmediata en '+dol(nv.r1)+'</b> (máximo de 20 días). Una recuperación sostenida por encima de ese nivel ';
    txt+='invalidaría la lectura bajista de corto plazo y ameritaría reevaluar la señal.';
  }else{
    txt+='Sin señal direccional clara: el rango operativo se ubica entre '+dol(nv.s1)+' y '+dol(nv.r1)+
      ' (mínimo y máximo de las últimas 20 sesiones). Conviene esperar una definición de la estructura antes de tomar posición.';
  }
  txt+='<br><br>';

  const caro=typeof fu.pe==="number"&&fu.pe>35, calidad=typeof fu.margen_operativo==="number"&&fu.margen_operativo>0.2;
  if(caro&&calidad) txt+='<b>La tensión central de esta emisora es entre calidad operativa y precio pagado:</b> los fundamentales son sólidos, pero el múltiplo no deja margen de error. ';
  else if(!caro&&calidad) txt+='<b>La combinación de rentabilidad alta con múltiplo contenido</b> es el argumento cuantitativo más fuerte de esta emisora. ';
  else if(caro&&!calidad) txt+='<b>El múltiplo exigente no está respaldado por la rentabilidad actual:</b> la valuación depende de una mejora operativa que aún no aparece en los números. ';
  if(rg.volatilidad_anualizada>40) txt+='Dado el perfil de volatilidad ('+fmt(rg.volatilidad_anualizada,1)+'% anual), el dimensionamiento de la posición importa más que la decisión de entrada.';

  return '<div class="vb"><h3>Calificación Ajustada por Riesgo</h3>'+track+
    '<div class="niv">'+
    nivc("SOPORTE 2 · MÍN 60D",nv.s2,ROJO)+nivc("SOPORTE 1 · MÍN 20D",nv.s1,ROJO)+
    nivc("RESISTENCIA 1 · MÁX 20D",nv.r1,VERDE)+nivc("MÁX 52 SEMANAS",nv.max52,VERDE)+
    '</div><div class="vt">'+txt+'</div></div>';
}
function nivc(l,v,col){
  return '<div class="nivc"><div class="ev" style="color:'+col+'">'+dol(v)+'</div><div class="el">'+l+'</div></div>';
}

cargar();
</script>
