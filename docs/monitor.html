<style>

.nivc .ev{font-family:var(--mono);font-size:14px;font-weight:600}

.rfooter{font-family:var(--mono);font-size:9px;color:var(--dim);border-top:1px solid var(--border);padding-top:14px;line-height:1.8;margin-top:8px}
.msg{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px;line-height:1.7}

.chtop{display:flex;align-items:flex-start;gap:6px}

.nota{background:var(--s2);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:8px;padding:12px 14px;margin-bottom:18px;font-size:12px;color:var(--muted);line-height:1.6}
.nota b{color:var(--text)}
.nota code{font-family:var(--mono);font-size:11px;color:var(--amber)}
.wlbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}

.perfil p{font-size:12.5px;color:var(--muted);line-height:1.7}
.perfil p.sindesc{color:var(--dim);font-style:italic}
.perfil-meta{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:11px;padding-top:11px;border-top:1px solid var(--border);line-height:1.7}
.perfil-meta a{color:var(--blue);text-decoration:none}
.perfil-idioma{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:8px}
.frase{font-size:12px;color:var(--muted);font-style:italic;margin-top:9px;padding-left:11px;border-left:2px solid var(--border2);line-height:1.5;max-width:520px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Cazador de Oportunidades<span>JARASOFT</span></h1>
      <div class="sub" id="sub">Cargando...</div>
      <div class="frase" id="frase"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap" id="botones">
      <button onclick="cargar()">↻ Actualizar</button>
      <span id="vivobtn"></span>
    </div>
  </div>
  <input id="busq" placeholder="Busca un ticker o empresa (ej. NVDA, WALMEX, Apple)..." oninput="buscar(this.value)" autocomplete="off">
  <div id="cont"><div class="msg">Cargando datos...</div></div>
</div>

<script>
const URL_JSON = "https://jrjara13.github.io/monitor-alertas/alertas.json";
const URL_RAPIDO = "https://jrjara13.github.io/monitor-alertas/rapido.json";
const CLAVE_WL = "jarasoft_watchlist";
const CLAVE_EX = "jarasoft_watchlist_excluidas";
const CLAVE_FH = "jarasoft_finnhub_key";
const CS = {"COMPRA FUERTE":"#2dd4a0","COMPRA":"#2dd4a0","MANTENER / OBSERVAR":"#6b6d87","VENTA":"#f05060","VENTA FUERTE":"#f05060"};
const CR = {Bajo:"#2dd4a0",Medio:"#f0b840",Alto:"#f05060"};
const VERDE="#2dd4a0",ROJO="#f05060",AMBAR="#f0b840",AZUL="#60a8f0",GRIS="#6b6d87";

let datos=null,indices=null,fechaDatos="",filtro="",vista="watch",detalle=null;
let wlLocal=[],wlRapido=[],wlExcluir=[],fechaRapido="";

function leerWL(){
  try{const v=localStorage.getItem(CLAVE_WL);wlLocal=v?JSON.parse(v):[];}
  catch(e){wlLocal=[];}
  if(!Array.isArray(wlLocal))wlLocal=[];
  try{const v=localStorage.getItem(CLAVE_EX);wlExcluir=v?JSON.parse(v):[];}
  catch(e){wlExcluir=[];}
  if(!Array.isArray(wlExcluir))wlExcluir=[];
}
function guardarWL(){
  try{
    localStorage.setItem(CLAVE_WL,JSON.stringify(wlLocal));
    localStorage.setItem(CLAVE_EX,JSON.stringify(wlExcluir));
  }catch(e){console.warn("No se pudo guardar el watchlist:",e);}
}
function enWL(t){
  return (wlLocal.indexOf(t)>=0||wlRapido.indexOf(t)>=0)&&wlExcluir.indexOf(t)<0;
}
function toggleWL(t,ev){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  const i=wlLocal.indexOf(t), e=wlExcluir.indexOf(t);
  if(enWL(t)){
    if(i>=0)wlLocal.splice(i,1);
    if(wlRapido.indexOf(t)>=0&&e<0)wlExcluir.push(t);
  }else{
    if(e>=0)wlExcluir.splice(e,1);
    if(wlRapido.indexOf(t)<0&&i<0)wlLocal.push(t);
  }
  guardarWL(); render();
}
function wlUnion(){
  return [...new Set([...wlRapido,...wlLocal])].filter(t=>wlExcluir.indexOf(t)<0);
}
function copiarWL(){
  const lista=wlUnion();
  const txt="# Watchlist — una emisora por línea.\n"+
    "# Se actualizan cada 5 minutos en horario de mercado.\n"+lista.join("\n")+"\n";
  const ok=()=>{const b=document.getElementById("btncopiar");if(b){b.textContent="✓ Copiado";setTimeout(()=>b.textContent="Copiar lista para watchlist.txt",2200);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(()=>alert(txt));
  }else alert(txt);
}

// ============ PRECIOS EN VIVO (Finnhub) ============
let fhKey="", vivos={}, timerVivo=null, ultimoVivo="", errorVivo="";
function esUS(t){return !/[.=^]/.test(t);}
function leerKey(){
  try{fhKey=localStorage.getItem(CLAVE_FH)||"";}catch(e){fhKey="";}
}
function pedirKey(){
  const actual=fhKey?"(ya configurada)":"";
  const k=prompt("Pega tu llave gratuita de Finnhub (finnhub.io) "+actual+
    "\n\nDejala vacia para desactivar los precios en vivo.",fhKey||"");
  if(k===null)return;
  fhKey=k.trim();
  try{localStorage.setItem(CLAVE_FH,fhKey);}catch(e){}
  vivos={}; errorVivo="";
  detenerVivo();
  if(fhKey)iniciarVivo();
  render();
}
function tickersAVigilar(){
  if(detalle)return esUS(detalle)?[detalle]:[];
  return wlUnion().filter(esUS);
}
async function jalarVivos(){
  if(!fhKey||!datos)return;
  if(typeof document.hidden==="boolean"&&document.hidden)return;
  const lista=tickersAVigilar();
  if(!lista.length)return;
  let hubo=false;
  for(const t of lista){
    try{
      const r=await fetch("https://finnhub.io/api/v1/quote?symbol="+encodeURIComponent(t)+"&token="+encodeURIComponent(fhKey));
      if(r.status===401||r.status===403){errorVivo="Llave rechazada por Finnhub.";detenerVivo();render();return;}
      if(r.status===429){errorVivo="Limite de consultas alcanzado; se reintenta en un momento.";break;}
      if(!r.ok)continue;
      const q=await r.json();
      if(typeof q.c==="number"&&q.c>0){
        vivos[t]={precio:q.c,cambio:q.dp,previo:q.pc,hora:Date.now()};
        if(datos[t]&&datos[t].tecnico)datos[t].tecnico.precio_actual=+q.c.toFixed(2);
        hubo=true; errorVivo="";
      }
    }catch(e){errorVivo="Sin conexion con Finnhub.";}
    await new Promise(r=>setTimeout(r,120));
  }
  if(hubo){
    ultimoVivo=new Date().toLocaleTimeString("es-MX");
    render();
  }
}
function iniciarVivo(){
  if(!fhKey)return;
  detenerVivo();
  jalarVivos();
  timerVivo=setInterval(jalarVivos,15000);
}
function detenerVivo(){if(timerVivo){clearInterval(timerVivo);timerVivo=null;}}
if(typeof document.addEventListener==="function"){
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden)detenerVivo(); else if(fhKey)iniciarVivo();
  });
}
function estadoVivo(){
  if(!fhKey)return '<button onclick="pedirKey()">◎ Activar precios en vivo</button>';
  if(errorVivo)return '<button onclick="pedirKey()" style="color:'+ROJO+'">◎ '+esc(errorVivo)+'</button>';
  return '<button onclick="pedirKey()" style="color:'+VERDE+'">● EN VIVO'+(ultimoVivo?" "+ultimoVivo:"")+'</button>';
}

// ============ FRASE DEL DIA ============
const FRASES = [
  "El mercado premia la paciencia, no la prisa.",
  "Un buen proceso soporta un mal resultado; un mal proceso no sobrevive a uno bueno.",
  "Perder la oportunidad cuesta menos que perder el capital.",
  "La disciplina vale más que la intuición cuando el mercado se mueve.",
  "Las convicciones se prueban en las caídas, no en las alzas.",
  "Quien conoce su horizonte no teme la volatilidad del camino.",
  "Comprar barato es fácil; sostenerlo, no.",
  "El riesgo no es la volatilidad: es no entender lo que tienes.",
  "Cada posición debe poder explicarse en una frase.",
  "Diversificar es admitir con humildad que uno puede equivocarse.",
  "El interés compuesto premia a quien no interrumpe.",
  "Reaccionar al ruido es la forma más cara de sentirse ocupado.",
  "Los datos informan la decisión; no la toman por ti.",
  "Un plan escrito resiste mejor que una convicción recordada.",
  "El mejor momento para definir tu salida es antes de entrar.",
  "La consistencia supera al acierto aislado.",
  "Dimensiona la posición antes de enamorarte de la tesis.",
  "El precio te dice qué opinan; el negocio te dice qué vale.",
  "Ninguna señal reemplaza el criterio de quien la interpreta.",
  "Saber cuándo no operar también es una decisión.",
  "El capital que no arriesgas hoy es el que te permite decidir mañana.",
  "La prudencia rara vez brilla, pero casi siempre permanece.",
  "Corrige la tesis cuando cambien los hechos, no cuando cambie el ánimo.",
  "El largo plazo se construye con decisiones que resisten el corto.",
  "Toda ganancia rápida tiene una probabilidad que no viste.",
  "Estudiar la empresa cuesta horas; ignorarla, años.",
  "El error más caro es el que no se documenta.",
  "La calma en la caída se prepara en la calma previa.",
  "Un portafolio ordenado refleja una mente ordenada.",
  "Medir sin actuar es contemplación; actuar sin medir es apuesta.",

function pintarFrase(){
  const el=document.getElementById("frase");
  if(!el)return;
  const hoy=new Date();
  const inicio=new Date(hoy.getFullYear(),0,0);
  const dia=Math.floor((hoy-inicio)/86400000);
  el.textContent=FRASES[(dia+hoy.getFullYear())%FRASES.length];
}

const fmt=(v,d=2)=>typeof v==="number"?v.toFixed(d):"—";
const pct=v=>typeof v==="number"?(v>=0?"+":"")+v.toFixed(2)+"%":"—";
const pc1=v=>typeof v==="number"?(v*100).toFixed(1)+"%":"—";
const colr=v=>typeof v!=="number"?GRIS:v>0?VERDE:v<0?ROJO:GRIS;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dol=v=>typeof v==="number"?"$"+fmt(v):"—";
function cap(n){
  if(typeof n!=="number")return "—";
  if(n>=1e12)return "$"+(n/1e12).toFixed(2)+"T";
  if(n>=1e9)return "$"+(n/1e9).toFixed(1)+"B";
  if(n>=1e6)return "$"+(n/1e6).toFixed(0)+"M";
  return "$"+n;
}
function miles(n){
  if(typeof n!=="number")return "—";
  const s=n<0?"-":"";n=Math.abs(n);
  if(n>=1e9)return s+"$"+(n/1e9).toFixed(2)+"B";
  if(n>=1e6)return s+"$"+(n/1e6).toFixed(1)+"M";
  return s+"$"+n.toFixed(0);
}
function leerFecha(s){
  if(!s)return "—";
  const d=new Date(String(s).replace(/\.(\d{3})\d+/,".$1"));
  return isNaN(d)?"—":d.toLocaleString("es-MX");
}

async function cargar(){
  leerWL(); leerKey();
  document.getElementById("sub").textContent="Cargando...";
  try{
    const r=await fetch(URL_JSON+"?t="+Date.now());
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    datos=j.tickers||j; indices=j.indices||{};
    fechaDatos=leerFecha(j.actualizado);
    try{
      const rr=await fetch(URL_RAPIDO+"?t="+Date.now());
      if(rr.ok){
        const jr=await rr.json();
        wlRapido=jr.watchlist||[];
        fechaRapido=leerFecha(jr.actualizado);
        if(jr.tickers)for(const [t,v] of Object.entries(jr.tickers))datos[t]=v;
        if(jr.indices&&Object.keys(jr.indices).length)indices=jr.indices;
      }
    }catch(e){}
    document.getElementById("sub").textContent=
      Object.keys(datos).length+" EMISORAS · "+fechaDatos+
      (fechaRapido?" · WATCHLIST "+fechaRapido:"");
    render();
    if(fhKey)iniciarVivo();
  }catch(e){
    document.getElementById("sub").textContent="Error";
    document.getElementById("cont").innerHTML='<div class="err">No se pudieron cargar los datos: '+esc(e.message)+'</div>';
  }
}

function media(s,n){const o=[];for(let i=0;i<s.length;i++){if(i<n-1){o.push(null);continue;}let x=0;for(let k=i-n+1;k<=i;k++)x+=s[k];o.push(x/n);}return o;}
function sparkline(serie,color,w=160,h=32){
  const s=(serie||[]).filter(v=>typeof v==="number");
  if(s.length<2)return "";
  const mn=Math.min(...s),mx=Math.max(...s),rg=mx-mn||1;
  const pts=s.map((v,i)=>(i/(s.length-1)*w).toFixed(1)+","+(h-(v-mn)/rg*h).toFixed(1)).join(" ");
  return '<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="display:block;margin-top:8px"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.6"/></svg>';
}
function graficoCompleto(serie,niv,pt){
  const s=(serie||[]).filter(v=>typeof v==="number");
  if(s.length<25)return '<div class="mno">Sin historial suficiente para graficar.</div>';
  const W=820,H=210,pL=52,pR=14,pT=20,pB=28,cW=W-pL-pR,cH=H-pT-pB;
  const m20=media(s,20),m50=media(s,50);
  let all=s.concat(m20.filter(v=>v!=null),m50.filter(v=>v!=null));
  if(typeof pt==="number")all=all.concat([pt]);
  const mn=Math.min(...all)*0.98,mx=Math.max(...all)*1.02,rg=mx-mn||1;
  const X=i=>(pL+i/(s.length-1)*cW).toFixed(1), Y=v=>(pT+cH-(v-mn)/rg*cH).toFixed(1);
  let h="";
  for(let i=0;i<=4;i++){const v=mn+i/4*rg,y=Y(v);
    h+='<line x1="'+pL+'" y1="'+y+'" x2="'+(W-pR)+'" y2="'+y+'" stroke="#141520"/>';
    h+='<text x="'+(pL-5)+'" y="'+(+y+3)+'" font-family="JetBrains Mono" font-size="9" fill="#6b6d87" text-anchor="end">$'+v.toFixed(0)+'</text>';}
  if(typeof pt==="number"&&pt>mn&&pt<mx){
    h+='<line x1="'+pL+'" y1="'+Y(pt)+'" x2="'+(W-pR)+'" y2="'+Y(pt)+'" stroke="'+AMBAR+'" stroke-width="1" stroke-dasharray="2,4" opacity=".7"/>';
    h+='<text x="'+(pL+5)+'" y="'+(Y(pt)-4)+'" font-family="JetBrains Mono" font-size="8" fill="'+AMBAR+'">PT CONSENSO $'+fmt(pt)+'</text>';}
  const li=(a,c,w2)=>{const p=a.map((v,i)=>v==null?null:X(i)+","+Y(v)).filter(Boolean).join(" ");
    return p?'<polyline points="'+p+'" fill="none" stroke="'+c+'" stroke-width="'+w2+'"/>':"";};
  const sube=s[s.length-1]>=s[0],col=sube?VERDE:ROJO;
  const area=X(0)+","+(pT+cH)+" "+s.map((v,i)=>X(i)+","+Y(v)).join(" ")+" "+X(s.length-1)+","+(pT+cH);
  h+='<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+col+'"/><stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>';
  h+='<polygon points="'+area+'" fill="url(#lg)" opacity=".13"/>';
  h+=li(s,col,2)+li(m20,AZUL,1.2)+li(m50,AMBAR,1.2);
  h+='<circle cx="'+X(s.length-1)+'" cy="'+Y(s[s.length-1])+'" r="4" fill="'+col+'"/>';
  h+='<text x="'+(pL+6)+'" y="'+(pT+10)+'" font-family="JetBrains Mono" font-size="8" fill="'+col+'">— Precio</text>';
  h+='<text x="'+(pL+70)+'" y="'+(pT+10)+'" font-family="JetBrains Mono" font-size="8" fill="'+AZUL+'">— SMA 20</text>';
  h+='<text x="'+(pL+140)+'" y="'+(pT+10)+'" font-family="JetBrains Mono" font-size="8" fill="'+AMBAR+'">— SMA 50</text>';
  return '<svg width="100%" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="display:block">'+h+'</svg>';
}

function render(){
  if(!datos)return;
  const vb=document.getElementById("vivobtn");
  if(vb)vb.innerHTML=estadoVivo();
  const cont=document.getElementById("cont");
  if(detalle&&datos[detalle]){cont.innerHTML=reporte(detalle,datos[detalle]);return;}
  if(filtro){
    const f=filtro.toLowerCase();
    const hits=Object.entries(datos).filter(([t,r])=>t.toLowerCase().includes(f)||(r.nombre||"").toLowerCase().includes(f));
    if(!hits.length){cont.innerHTML='<div class="msg">Sin resultados para "'+esc(filtro)+'".<br>El universo cubre acciones líquidas de EE.UU., ETFs y BMV. Para emisoras de BMV usa el sufijo .MX (ej. WALMEX.MX).</div>';return;}
    if(hits.length===1){cont.innerHTML=reporte(hits[0][0],hits[0][1]);return;}
    hits.sort((a,b)=>b[1].compuesto.score_compuesto-a[1].compuesto.score_compuesto);
    cont.innerHTML='<div class="sl">'+hits.length+' coincidencias — toca una para abrir su reporte</div><div class="grid">'+hits.slice(0,60).map(([t,r])=>card(t,r)).join("")+'</div>';
    return;
  }
  const todos=Object.entries(datos);
  const compra=todos.filter(([,r])=>r.compuesto.señal.includes("COMPRA"));
  const venta=todos.filter(([,r])=>r.compuesto.señal.includes("VENTA"));
  const union=wlUnion();
  let h='<div class="sl">Mercados en este momento</div><div class="idx-grid">'+Object.values(indices||{}).map(idxCard).join("")+'</div>';
  h+='<div class="sl">Señales activas</div><div class="tabs">'+
     tab("watch","★ MI WATCHLIST ("+union.length+")")+
     tab("compra","COMPRAS ("+compra.length+")")+tab("venta","VENTAS ("+venta.length+")")+
     tab("etf","ETFs")+tab("riesgo","COMPRAS BAJO RIESGO")+'</div>';
  if(vista==="watch"){
    const soloLocal=wlLocal.filter(t=>wlRapido.indexOf(t)<0&&wlExcluir.indexOf(t)<0);
    h+='<div class="wlbar"><button id="btncopiar" onclick="copiarWL()">Copiar lista para watchlist.txt</button></div>';
    if(soloLocal.length){
      h+='<div class="nota"><b>'+soloLocal.length+' emisora'+(soloLocal.length>1?'s':'')+
         ' marcada'+(soloLocal.length>1?'s':'')+' solo en este dispositivo</b> ('+soloLocal.map(esc).join(", ")+
         '): se actualizan cada 30 minutos con el universo completo. Para que entren al refresco de 5 minutos, '+
         'copia la lista con el botón de arriba y pégala en <code>watchlist.txt</code> en tu repositorio de GitHub.</div>';
    }
    const ocultas=wlExcluir.filter(t=>wlRapido.indexOf(t)>=0);
    if(ocultas.length){
      h+='<div class="nota"><b>'+ocultas.length+' emisora'+(ocultas.length>1?'s':'')+
         ' oculta'+(ocultas.length>1?'s':'')+' en este dispositivo</b> ('+ocultas.map(esc).join(", ")+
         '): el motor las sigue actualizando cada 5 minutos porque siguen en <code>watchlist.txt</code>.</div>';
    }
    const filas=union.map(t=>[t,datos[t]]).filter(([,r])=>r);
    const faltan=union.filter(t=>!datos[t]);
    if(!filas.length){
      h+='<div class="msg">Tu watchlist está vacío.<br>Toca la estrella ☆ en cualquier emisora para agregarla.</div>';
    }else{
      filas.sort((a,b)=>b[1].compuesto.score_compuesto-a[1].compuesto.score_compuesto);
      h+='<div class="grid">'+filas.map(([t,r])=>card(t,r)).join("")+'</div>';
    }
    if(faltan.length)h+='<div class="msg">Sin datos disponibles para: '+faltan.map(esc).join(", ")+'.</div>';
    cont.innerHTML=h;
    return;
  }
  let lista;
  if(vista==="compra")lista=compra.sort((a,b)=>b[1].compuesto.score_compuesto-a[1].compuesto.score_compuesto);
  else if(vista==="venta")lista=venta.sort((a,b)=>a[1].compuesto.score_compuesto-b[1].compuesto.score_compuesto);
  else if(vista==="etf")lista=todos.filter(([,r])=>r.tipo==="etf").sort((a,b)=>b[1].compuesto.score_compuesto-a[1].compuesto.score_compuesto);
  else lista=compra.filter(([,r])=>r.riesgo.nivel_riesgo==="Bajo").sort((a,b)=>b[1].compuesto.score_compuesto-a[1].compuesto.score_compuesto);
  h+=lista.length?'<div class="grid">'+lista.slice(0,12).map(([t,r])=>card(t,r)).join("")+'</div>'+(lista.length>12?'<div class="msg">Mostrando 12 de '+lista.length+'. Usa el buscador para abrir cualquier emisora.</div>':''):'<div class="msg">Sin resultados en esta vista.</div>';
  cont.innerHTML=h;
}

          :'<p class="sindesc">Descripción aún no disponible. Se completa conforme el motor refresca los datos de cada emisora.</p>')+
        (ex.length?'<div class="perfil-meta">'+ex.join(" · ")+
          (r.web?' · <a href="'+esc(r.web)+'" target="_blank" rel="noopener">Sitio oficial</a>':'')+'</div>':'')+
        '</div>';
    }
  }

  h+='<div class="gw"><div class="gsw">'+gauge(rg.score_riesgo)+
     '<div class="gc"><div class="gs" style="color:'+cr+'">'+Math.round(rg.score_riesgo)+'</div><div class="gl">SCORE RIESGO</div></div></div>'+
     '<div class="gm"><h2>'+tituloGauge(rg,r.compuesto)+'</h2><p>'+resumenGauge(r)+'</p>'+
     '<div class="gv" style="background:'+c+'1a;color:'+c+';border-color:'+c+'4d">'+
     (sc>=0?'▲ ':'▼ ')+esc(r.compuesto.señal)+' — '+etiquetaSenal(r)+'</div></div></div>';

  h+='<div class="sl">Métricas Clave</div><div class="kstrip">'+
     ki("Score Compuesto",(sc>=0?"+":"")+sc,"de ±100",c)+
     ki("RSI / Estocástico",fmt(tc.rsi,1)+" / "+fmt(tc.estocastico_k,0),
        "Régimen "+esc(tc.regimen||"—"),
        tc.regimen==="Alcista"?VERDE:tc.regimen==="Bajista"?ROJO:AMBAR)+
     (esETF
       ? ki("Costo Anual",pc1(r.etf&&r.etf.costo_anual),"Comisión del fondo",
            (r.etf&&typeof r.etf.costo_anual==="number")?(r.etf.costo_anual<0.002?VERDE:r.etf.costo_anual>0.0075?ROJO:AMBAR):GRIS)+
         ki("Rend. 3 años",pc1(r.etf&&r.etf.rend_3a),"Anualizado",colr((r.etf&&r.etf.rend_3a)||null))+
         ki("Rend. 5 años",pc1(r.etf&&r.etf.rend_5a),"Anualizado",colr((r.etf&&r.etf.rend_5a)||null))
       : ki("P/E vs Sector",typeof fu.pe==="number"?fmt(fu.pe,1)+"×":"—",
            typeof fu.pe_relativo_sector==="number"
              ?fmt(fu.pe_relativo_sector,2)+"× la mediana ("+fmt(fu.pe_mediana_sector,1)+"×)"
              :"PEG "+(typeof fu.peg==="number"?fmt(fu.peg,2)+"×":"—"),
            typeof fu.pe_relativo_sector!=="number"?GRIS
              :fu.pe_relativo_sector<0.80?VERDE:fu.pe_relativo_sector>1.30?AMBAR:AZUL)+
         ki("Margen Operativo",pc1(fu.margen_operativo),"ROE "+pc1(fu.roe),
            typeof fu.margen_operativo!=="number"?GRIS:fu.margen_operativo>0.2?VERDE:fu.margen_operativo<0.05?ROJO:AMBAR)+
         ki("Crec. Ingresos",pc1(fu.crecimiento_ingresos),"Últimos 12 meses",
            typeof fu.crecimiento_ingresos!=="number"?GRIS:fu.crecimiento_ingresos>0.1?VERDE:fu.crecimiento_ingresos<0?ROJO:AMBAR))+
     ki("Volatilidad Anual",fmt(rg.volatilidad_anualizada,1)+"%","Beta "+fmt(rg.beta,2),
        rg.volatilidad_anualizada>45?ROJO:rg.volatilidad_anualizada<20?VERDE:AMBAR)+
     '</div>';

  h+='<div class="sl">Gráfica de Precio · 120 Días Hábiles</div><div class="cb">'+
     '<div class="ct">'+tituloGrafico(tc)+'</div>'+
     '<div class="cs">MÁX 52S '+dol(nv.max52)+' · MÍN 52S '+dol(nv.min52)+
     (typeof fu.precio_objetivo==="number"?' · PT consenso '+dol(fu.precio_objetivo):'')+'</div>'+
     graficoCompleto(r.serie,nv,fu.precio_objetivo)+'</div>';

  h+='<div class="sl">Rendimiento y Fuerza Relativa</div><div class="kstrip k5">'+
     ki("5 días",pct(rd.d5),"",colr(rd.d5))+ki("1 mes",pct(rd.m1),"",colr(rd.m1))+
     ki("3 meses",pct(rd.m3),"",colr(rd.m3))+ki("En el año",pct(rd.ytd),"",colr(rd.ytd))+
     ki("vs S&P 500 (3m)",typeof rd.vs_sp500_3m==="number"?(rd.vs_sp500_3m>=0?"+":"")+fmt(rd.vs_sp500_3m,1)+" pp":"—",
        typeof rd.vs_sp500_3m==="number"?(rd.vs_sp500_3m>=0?"Supera al índice":"Bajo el índice"):"",colr(rd.vs_sp500_3m))+
     '</div>';

  if(!esETF){
    h+='<div class="sl">Tarjeta de Valuación</div><div class="g3">'+tarjetasValuacion(fu,rg,upside)+'</div>';
  }

  if((r.trimestres||[]).length){
    h+='<div class="sl">Tendencia Trimestral · Últimos '+r.trimestres.length+' Trimestres Reportados</div><div class="qt"><table>'+
      '<thead><tr><th>Trimestre</th><th>Ingresos</th><th>Var. a/a</th><th>Util. Operativa</th><th>Margen Op.</th><th>Util. Neta</th><th>EPS</th></tr></thead><tbody>';
    r.trimestres.forEach((q,i)=>{
      const ult=i===r.trimestres.length-1;
      h+='<tr'+(ult?' class="trh"':'')+'><td style="color:'+(ult?VERDE:GRIS)+';font-weight:'+(ult?600:400)+'">'+(ult?'★ ':'')+esc(q.periodo)+'</td>'+
        '<td>'+miles(q.ingresos)+'</td><td style="color:'+colr(q.var_ingresos)+'">'+(typeof q.var_ingresos==="number"?pct(q.var_ingresos):"—")+'</td>'+
        '<td>'+miles(q.util_operativa)+'</td><td style="color:'+(typeof q.margen_op==="number"?(q.margen_op>15?VERDE:q.margen_op>0?AMBAR:ROJO):GRIS)+'">'+
        (typeof q.margen_op==="number"?fmt(q.margen_op,1)+"%":"—")+'</td>'+
        '<td>'+miles(q.util_neta)+'</td><td>'+(typeof q.eps==="number"?"$"+fmt(q.eps,2):"—")+'</td></tr>';
    });
    h+='</tbody></table><div style="font-family:var(--mono);font-size:9px;color:var(--dim);padding:8px 12px">Estados financieros trimestrales según los reporta la fuente.</div></div>';
  }

  h+=desgloseScore(r);

  const fav=factoresFavor(r),con=factoresContra(r);
  h+='<div class="sl">Factores a Favor y en Contra · Derivados de las Métricas</div><div class="dual">'+
     '<div class="dc cat"><h3 style="color:'+VERDE+'">▲ FACTORES A FAVOR</h3><ul>'+
     (fav.length?fav.map(x=>'<li>'+x+'</li>').join(""):'<li>Sin factores positivos destacables en las métricas actuales.</li>')+'</ul></div>'+
     '<div class="dc ris"><h3 style="color:'+ROJO+'">▼ FACTORES EN CONTRA</h3><ul>'+
     (con.length?con.map(x=>'<li>'+x+'</li>').join(""):'<li>Sin factores de riesgo destacables en las métricas actuales.</li>')+'</ul></div></div>';

  h+='<div class="rfooter">'+esc(t)+' · Reporte generado automáticamente por Cazador de Oportunidades · JARASOFT · Datos: Yahoo Finance'+
     (lv?' · Precio en vivo: Finnhub':'')+' · '+esc(fechaDatos)+'<br>'+
     'NO CONSTITUYE ASESORÍA DE INVERSIÓN. Herramienta de apoyo cuantitativo basada en reglas fijas. Las señales deben interpretarse junto con su propio análisis y el perfil del cliente.</div>';
  return h;
}

function ki(l,v,s,col){
  return '<div class="ki"><div class="kl">'+l+'</div><div class="kv" style="color:'+(col||"var(--text)")+'">'+v+'</div>'+
    '<div class="ks">'+(s||"&nbsp;")+'</div></div>';
}
function tituloGauge(rg,comp){
  const n=rg.nivel_riesgo;
  const t=comp.señal.includes("COMPRA")?"Señal de Compra":comp.señal.includes("VENTA")?"Señal de Venta":"Sin Señal Direccional";
  return "Riesgo "+n+" · "+t;
}
function etiquetaSenal(r){
  if(r.tipo==="etf")return r.tecnico.score_tecnico>0?"MOMENTUM TÉCNICO POSITIVO":"MOMENTUM TÉCNICO DÉBIL";
  const tp=r.tecnico.score_tecnico>0,fp=r.fundamental.score_fundamental>0;
  if(tp&&fp)return "TÉCNICO Y FUNDAMENTAL ALINEADOS";
  if(tp&&!fp)return "MOMENTUM SIN RESPALDO FUNDAMENTAL";
  if(!tp&&fp)return "FUNDAMENTALES SÓLIDOS, TÉCNICO DÉBIL";
  return "DEBILIDAD EN AMBOS FRENTES";
}
function resumenGauge(r){
  const rg=r.riesgo,tc=r.tecnico,fu=r.fundamental,sc=r.compuesto.score_compuesto;
  let s="Score de riesgo <b>"+fmt(rg.score_riesgo,1)+"/100 ("+rg.nivel_riesgo+")</b>: volatilidad anual de "+
    fmt(rg.volatilidad_anualizada,1)+"%, caída máxima de "+fmt(rg.max_drawdown,1)+"% en los últimos doce meses y beta de "+
    fmt(rg.beta,2)+". ";
  if(r.tipo==="etf"){
    s+="El score compuesto de <b>"+(sc>=0?"+":"")+sc+"</b> proviene del bloque técnico ("+tc.score_tecnico+
      "/4) y la penalización por riesgo. <b>Los fondos cotizados no tienen múltiplos ni estados financieros propios</b>, "+
      "por lo que el bloque fundamental no aplica y aporta cero — no se les premia ni castiga por ello.";
    return s;
  }
  s+="El score compuesto de <b>"+(sc>=0?"+":"")+sc+"</b> resulta de un bloque técnico de "+tc.score_tecnico+
    "/4 y uno fundamental de "+fu.score_fundamental+"/6, con la penalización por riesgo aplicada. ";
  if(typeof fu.pe_relativo_sector==="number")
    s+="Su P/E de "+fmt(fu.pe,1)+"× equivale a "+fmt(fu.pe_relativo_sector,2)+
      "× la mediana de su sector ("+fmt(fu.pe_mediana_sector,1)+"×).";
  else if(typeof fu.pe==="number")
    s+="El P/E de "+fmt(fu.pe,1)+"× "+(fu.pe<15?"es bajo frente al promedio del mercado.":fu.pe>35?"es exigente.":"está en rango razonable.");
  return s;
}
function tituloGrafico(tc){
  const p=tc.precio_actual;
  if(typeof p!=="number"||typeof tc.sma20!=="number"||typeof tc.sma50!=="number")return "Evolución del precio con medias móviles";
  if(p>tc.sma20&&tc.sma20>tc.sma50)return "Precio sobre SMA20 y SMA50, con las medias alineadas al alza — estructura alcista";
  if(p<tc.sma20&&tc.sma20<tc.sma50)return "Precio bajo SMA20 y SMA50, con las medias alineadas a la baja — estructura bajista";
  return "Precio y medias móviles sin alineación clara — tendencia en transición";
}

function tarjetasValuacion(fu,rg,upside){
  let h="";
  const rel=fu.pe_relativo_sector, med=fu.pe_mediana_sector;
  h+=mcard("P/U vs Sector",
    typeof fu.pe!=="number"?"SIN DATO":fu.pe<0?"PÉRDIDAS":
      typeof rel!=="number"?"SIN PARES":rel<0.80?"BARATA":rel>1.30?"CARA":"EN LÍNEA",
    typeof fu.pe!=="number"?GRIS:fu.pe<0?ROJO:
      typeof rel!=="number"?GRIS:rel<0.80?VERDE:rel>1.30?AMBAR:AZUL,
    typeof fu.pe==="number"?fmt(fu.pe,1)+"×":"—",
    typeof fu.pe!=="number"?"Sin dato disponible en la fuente para esta emisora.":
    fu.pe<0?"La empresa reporta pérdidas; el múltiplo de utilidades no es interpretable.":
    typeof rel!=="number"?"Su sector no tiene suficientes emisoras comparables en el universo; se evalúa contra umbrales generales.":
    "La mediana de su sector es "+fmt(med,1)+"×, de modo que cotiza a <b>"+fmt(rel,2)+
      "× sus pares</b>. "+(rel<0.80?"Descuento frente a empresas del mismo giro.":
      rel>1.30?"Prima frente a empresas del mismo giro: el mercado le exige más.":
      "Valuación alineada con su industria."));
  h+=mcard("PEG",typeof fu.peg!=="number"?"SIN DATO":fu.peg<1?"FAVORABLE":fu.peg>2?"CARO":"NEUTRAL",
    typeof fu.peg!=="number"?GRIS:fu.peg<1?VERDE:fu.peg>2?ROJO:AMBAR,
    typeof fu.peg==="number"?fmt(fu.peg,2)+"×":"—",
    typeof fu.peg!=="number"?"Sin dato disponible.":
    fu.peg<1?"Por debajo de 1: ajustado por su tasa de crecimiento, el múltiplo deja de verse caro.":
    fu.peg>2?"Por encima de 2: el precio pagado supera con holgura el crecimiento esperado.":
    "Cerca de 1: el múltiplo guarda proporción con el crecimiento esperado.");
  h+=mcard("PT Consenso",typeof upside!=="number"?"SIN DATO":upside>0?pct(upside)+" UPSIDE":pct(upside)+" DOWNSIDE",
    typeof upside!=="number"?GRIS:upside>0?VERDE:ROJO,
    typeof fu.precio_objetivo==="number"?dol(fu.precio_objetivo):"—",
    typeof fu.precio_objetivo!=="number"?"Sin cobertura de analistas registrada en la fuente.":
    "Precio objetivo promedio de analistas"+(fu.num_analistas?" ("+fu.num_analistas+" opiniones)":"")+". Implica un recorrido de "+pct(upside)+" desde el nivel actual.");
  h+=mcard("Rentabilidad",typeof fu.margen_operativo!=="number"?"SIN DATO":fu.margen_operativo>0.2?"MUY ALTA":fu.margen_operativo<0.05?"ESTRECHA":"INTERMEDIA",
    typeof fu.margen_operativo!=="number"?GRIS:fu.margen_operativo>0.2?VERDE:fu.margen_operativo<0.05?ROJO:AMBAR,
    pc1(fu.margen_operativo),
    "Margen operativo"+(typeof fu.roe==="number"?", con ROE de "+pc1(fu.roe):"")+". "+
    (typeof fu.margen_operativo!=="number"?"Sin dato disponible.":
     fu.margen_operativo>0.2?"Indica poder de fijación de precios y apalancamiento operativo.":
     fu.margen_operativo<0.05?"Poco colchón ante aumentos de costos o presión competitiva.":
     "Rentabilidad en línea con el promedio del mercado."));
  h+=mcard("Apalancamiento",typeof fu.deuda_capital!=="number"?"SIN DATO":fu.deuda_capital<50?"BAJO":fu.deuda_capital>150?"ELEVADO":"MODERADO",
    typeof fu.deuda_capital!=="number"?GRIS:fu.deuda_capital<50?VERDE:fu.deuda_capital>150?ROJO:AMBAR,
    typeof fu.deuda_capital==="number"?fmt(fu.deuda_capital,1):"—",
    "Deuda sobre capital. "+(typeof fu.deuda_capital!=="number"?"Sin dato disponible.":
     fu.deuda_capital<50?"Balance poco apalancado: baja sensibilidad al ciclo de tasas.":
     fu.deuda_capital>150?"Apalancamiento elevado: amplifica el riesgo financiero.":
     "Nivel de deuda manejable frente al capital contable."));
  h+=mcard("Volatilidad",rg.volatilidad_anualizada>45?"ELEVADA":rg.volatilidad_anualizada<20?"CONTENIDA":"MEDIA",
    rg.volatilidad_anualizada>45?ROJO:rg.volatilidad_anualizada<20?VERDE:AMBAR,
    fmt(rg.volatilidad_anualizada,1)+"%",
    "Anualizada. Con beta de "+fmt(rg.beta,2)+" y caída máxima de "+fmt(rg.max_drawdown,1)+
    "%, "+(rg.volatilidad_anualizada>45?"requiere dimensionar la posición con cuidado.":"el perfil de fluctuación es manejable."));
  return h;
}

function explicaTecnico(r){
  const s=r.tecnico.señales||{}, reg=r.tecnico.regimen;
  const partes=[];
  if(reg==="Alcista")partes.push("El precio se ubica sobre sus medias: <b>tendencia alcista</b>.");
  else if(reg==="Bajista")partes.push("El precio se ubica bajo sus medias: <b>tendencia bajista</b>.");
  else partes.push("Las medias no muestran dirección clara: <b>régimen lateral</b>.");
  if(s.momentum>0)partes.push("El MACD acompaña y gana fuerza.");
  else if(s.momentum<0)partes.push("El MACD se debilita.");
  else partes.push("El MACD no aporta dirección.");
  if(s.timing>0)partes.push(reg==="Alcista"
    ?"El RSI y el estocástico señalan un <b>retroceso dentro de la tendencia</b>: punto de entrada favorable."
    :"El estocástico gira al alza desde sobreventa.");
  else if(s.timing<0)partes.push(reg==="Bajista"
    ?"El rebote luce agotado dentro de una tendencia a la baja."
    :"El papel viene <b>extendido</b>: entrar aquí ofrece poco margen.");
  else if(reg==="Bajista")partes.push("Aunque marque sobreventa, <b>no se premia comprar en tendencia bajista</b>.");
  else partes.push("Sin lectura de entrada destacable.");
  return partes.join(" ");
}

function desgloseScore(r){
  const tc=r.tecnico,fu=r.fundamental,rg=r.riesgo,esETF=r.tipo==="etf";
  const st=tc.señales||{},sf=fu.señales||{};
  const et=(k,l)=>{const v=st[k];if(v===undefined)return "";
    const col=v>0?VERDE:v<0?ROJO:AMBAR;
    return '<span class="sbit" style="background:'+col+'1a;color:'+col+'">'+l+' · '+(v>0?"+"+v:v<0?"−"+Math.abs(v):"0")+'</span>';};
  const ef=(k,l)=>{const v=sf[k];if(v===undefined)return "";
    const col=v>0?VERDE:v<0?ROJO:AMBAR;
    return '<span class="sbit" style="background:'+col+'1a;color:'+col+'">'+l+' · '+(v>0?"+1":v<0?"−1":"0")+'</span>';};
  const pctT=(tc.score_tecnico+4)/8*100, pctF=(fu.score_fundamental+6)/12*100, pctR=100-rg.score_riesgo;
  const colT=tc.score_tecnico>0?VERDE:tc.score_tecnico<0?ROJO:AMBAR;
  const colF=fu.score_fundamental>0?VERDE:fu.score_fundamental<0?ROJO:AMBAR;
  const colR=CR[rg.nivel_riesgo]||AMBAR;
  return '<div class="sl">Desglose del Score</div><div class="sb">'+
    '<h3>Componentes del Score Compuesto — 45% técnico · 40% fundamental · 15% penalización por riesgo</h3>'+
    '<div class="sbr"><div class="sbh"><div class="sbn">BLOQUE TÉCNICO</div><div class="sbs" style="color:'+colT+'">'+
    tc.score_tecnico+' / 4</div></div><div class="sbbar"><div class="sbf" style="width:'+pctT+'%;background:'+colT+'"></div></div>'+
    '<div class="sbi">'+et("tendencia","Tendencia")+et("momentum","Momentum")+et("timing","Timing")+
    '<span class="sbit" style="background:'+GRIS+'1a;color:'+GRIS+'">Régimen: '+esc(tc.regimen||"—")+'</span></div>'+
    '<div class="mno" style="margin-top:8px">'+explicaTecnico(r)+'</div></div>'+
    '<div class="sbr"><div class="sbh"><div class="sbn">BLOQUE FUNDAMENTAL</div><div class="sbs" style="color:'+(esETF?GRIS:colF)+'">'+
    (esETF?'No aplica':fu.score_fundamental+' / 6')+'</div></div><div class="sbbar"><div class="sbf" style="width:'+(esETF?50:pctF)+'%;background:'+(esETF?GRIS:colF)+'"></div></div>'+
    '<div class="sbi">'+(esETF
      ?'<span class="sbit" style="background:'+GRIS+'1a;color:'+GRIS+'">Un ETF no tiene P/E, ROE ni márgenes propios · aporta 0</span>'
      :(ef("pe","P/E")+ef("peg","PEG")+ef("margen","Margen")+ef("crecimiento","Crecimiento")+ef("roe","ROE")+ef("deuda","Deuda")+
        (Object.keys(sf).length?"":'<span class="sbit" style="background:'+GRIS+'1a;color:'+GRIS+'">Fundamentales aún no disponibles</span>')))+'</div></div>'+
    '<div class="sbr"><div class="sbh"><div class="sbn">PENALIZACIÓN POR RIESGO</div><div class="sbs" style="color:'+colR+'">'+
    fmt(rg.score_riesgo,1)+' / 100</div></div><div class="sbbar"><div class="sbf" style="width:'+pctR+'%;background:'+colR+'"></div></div>'+
    '<div class="sbi"><span class="sbit" style="background:'+colR+'1a;color:'+colR+'">Volatilidad '+fmt(rg.volatilidad_anualizada,1)+'% · 35%</span>'+
    '<span class="sbit" style="background:'+colR+'1a;color:'+colR+'">Drawdown '+fmt(rg.max_drawdown,1)+'% · 30%</span>'+
    '<span class="sbit" style="background:'+colR+'1a;color:'+colR+'">Beta '+fmt(rg.beta,2)+' · 20%</span>'+
    '<span class="sbit" style="background:'+colR+'1a;color:'+colR+'">ATR '+fmt(rg.atr_relativo,2)+'% · 15%</span></div></div></div>';
}

function factoresFavor(r){
  const tc=r.tecnico,fu=r.fundamental,rg=r.riesgo,rd=r.rendimiento||{},f=[];
  const p=tc.precio_actual, esETF=r.tipo==="etf";
  if(typeof p==="number"&&typeof tc.sma20==="number"&&typeof tc.sma50==="number"&&p>tc.sma20&&tc.sma20>tc.sma50)
    f.push("Estructura técnica alcista: el precio cotiza sobre sus medias de 20 y 50 días, con las medias alineadas al alza");
  if(typeof p==="number"&&typeof tc.sma200==="number"&&p>tc.sma200)
    f.push("Se mantiene sobre la media de 200 días ("+dol(tc.sma200)+"), referencia de tendencia alcista de largo plazo");
  if(typeof tc.macd_hist==="number"&&tc.macd_hist>0)
    f.push("Histograma MACD positivo: el momentum de corto plazo sigue vigente");
  if((tc.señales||{}).timing>0)
    f.push("Timing favorable: con RSI en "+fmt(tc.rsi,1)+" y estocástico en "+fmt(tc.estocastico_k,0)+
      ", ofrece un punto de entrada dentro de su tendencia en vez de estar extendido");
  if(typeof fu.pe_relativo_sector==="number"&&fu.pe_relativo_sector<0.80)
    f.push("Cotiza a "+fmt(fu.pe_relativo_sector,2)+"× la mediana de P/E de su sector ("+
      fmt(fu.pe_mediana_sector,1)+"×): barata frente a sus pares, no solo frente al mercado");
  if(esETF&&r.etf){
    if(typeof r.etf.costo_anual==="number"&&r.etf.costo_anual<0.002)
      f.push("Costo anual de "+pc1(r.etf.costo_anual)+": comisión muy baja, erosiona poco el rendimiento de largo plazo");
    if(typeof r.etf.activos==="number"&&r.etf.activos>1e10)
      f.push("Activos bajo gestión de "+cap(r.etf.activos)+": tamaño que suele traducirse en mejor liquidez");
    if(typeof r.etf.rend_5a==="number"&&r.etf.rend_5a>0.08)
      f.push("Rendimiento anualizado de "+pc1(r.etf.rend_5a)+" a cinco años");
  }
  if(typeof fu.crecimiento_ingresos==="number"&&fu.crecimiento_ingresos>0.15)
    f.push("Crecimiento de ingresos de "+pc1(fu.crecimiento_ingresos)+" anual"+
      (typeof fu.margen_operativo==="number"&&fu.margen_operativo>0.2?" con margen operativo de "+pc1(fu.margen_operativo):""));
  if(typeof fu.peg==="number"&&fu.peg<1)
    f.push("PEG de "+fmt(fu.peg,2)+"×: ajustado por crecimiento, el múltiplo deja de ser caro");
  if(typeof fu.pe==="number"&&fu.pe>0&&fu.pe<15&&typeof fu.pe_relativo_sector!=="number")
    f.push("P/E de "+fmt(fu.pe,1)+"×, por debajo del promedio del mercado");
  if(typeof fu.roe==="number"&&fu.roe>0.15)
    f.push("ROE de "+pc1(fu.roe)+": retorno sobre capital en el rango alto del mercado");
  if(typeof fu.deuda_capital==="number"&&fu.deuda_capital<50)
    f.push("Deuda/Capital de "+fmt(fu.deuda_capital,1)+": balance sin apalancamiento relevante");
  if(typeof rd.vs_sp500_3m==="number"&&rd.vs_sp500_3m>0)
    f.push("Supera al S&P 500 por "+fmt(rd.vs_sp500_3m,1)+" puntos porcentuales en tres meses");
  if(typeof fu.precio_objetivo==="number"&&typeof p==="number"&&fu.precio_objetivo>p)
    f.push("Precio objetivo de consenso en "+dol(fu.precio_objetivo)+", "+pct((fu.precio_objetivo/p-1)*100)+" sobre el nivel actual");
  if(rg.nivel_riesgo==="Bajo")
    f.push("Perfil de riesgo bajo: volatilidad de "+fmt(rg.volatilidad_anualizada,1)+"% y beta de "+fmt(rg.beta,2));
  if(typeof tc.volumen_relativo==="number"&&tc.volumen_relativo>1.5)
    f.push("Volumen reciente "+fmt(tc.volumen_relativo,1)+"× su promedio: interés inusual");
  return f;
}

function factoresContra(r){
  const tc=r.tecnico,fu=r.fundamental,rg=r.riesgo,rd=r.rendimiento||{},f=[];
  const p=tc.precio_actual, esETF=r.tipo==="etf";
  if(typeof p==="number"&&typeof tc.sma20==="number"&&typeof tc.sma50==="number"&&p<tc.sma20&&tc.sma20<tc.sma50)
    f.push("Estructura técnica bajista: el precio cotiza bajo sus medias de 20 y 50 días");
  if(typeof p==="number"&&typeof tc.sma200==="number"&&p<tc.sma200)
    f.push("Cotiza bajo la media de 200 días ("+dol(tc.sma200)+"), señal de debilidad de largo plazo");
  if(typeof tc.macd_hist==="number"&&tc.macd_hist<0)
    f.push("Histograma MACD negativo: el momentum de corto plazo es bajista");
  if((tc.señales||{}).timing<0)
    f.push("Timing desfavorable: con RSI en "+fmt(tc.rsi,1)+" y estocástico en "+fmt(tc.estocastico_k,0)+
      ", el papel está extendido y entrar en este punto deja poco margen");
  if(tc.regimen==="Bajista"&&typeof tc.estocastico_k==="number"&&tc.estocastico_k<20)
    f.push("El estocástico marca sobreventa ("+fmt(tc.estocastico_k,0)+") pero dentro de una tendencia bajista: "+
      "comprar aquí equivale a atrapar un cuchillo cayendo");
  if(typeof fu.pe_relativo_sector==="number"&&fu.pe_relativo_sector>1.30)
    f.push("Cotiza a "+fmt(fu.pe_relativo_sector,2)+"× la mediana de P/E de su sector ("+
      fmt(fu.pe_mediana_sector,1)+"×): cara incluso comparada con sus pares directos");
  if(esETF){
    f.push("Al ser un fondo cotizado, la señal se apoya solo en el bloque técnico y de riesgo");
    if(r.etf&&typeof r.etf.costo_anual==="number"&&r.etf.costo_anual>0.0075)
      f.push("Costo anual de "+pc1(r.etf.costo_anual)+": comisión elevada que erosiona el rendimiento compuesto");
    if(r.etf&&typeof r.etf.activos==="number"&&r.etf.activos<5e8)
      f.push("Activos bajo gestión de "+cap(r.etf.activos)+": tamaño reducido, con diferenciales más amplios");
  }
  if(typeof fu.pe==="number"&&fu.pe>35&&typeof fu.pe_relativo_sector!=="number")
    f.push("P/E de "+fmt(fu.pe,1)+"× descuenta la continuidad del crecimiento actual");
  if(typeof fu.pe==="number"&&fu.pe<0)
    f.push("La empresa reporta pérdidas: la valuación depende enteramente de expectativas futuras");
  if(typeof fu.crecimiento_ingresos==="number"&&fu.crecimiento_ingresos<0)
    f.push("Los ingresos se contraen "+pc1(fu.crecimiento_ingresos)+" anual: señal de deterioro operativo");
  if(typeof fu.margen_operativo==="number"&&fu.margen_operativo<0.05)
    f.push("Margen operativo de "+pc1(fu.margen_operativo)+": poco colchón ante aumentos de costos");
  if(typeof fu.deuda_capital==="number"&&fu.deuda_capital>150)
    f.push("Deuda/Capital de "+fmt(fu.deuda_capital,1)+": apalancamiento elevado");
  if(rg.volatilidad_anualizada>40)
    f.push("Volatilidad anualizada de "+fmt(rg.volatilidad_anualizada,1)+"%, muy por encima del promedio del mercado");
  if(typeof rg.beta==="number"&&rg.beta>1.3)
    f.push("Beta de "+fmt(rg.beta,2)+": en una corrección, la caída esperada supera a la del índice");
  if(typeof rg.max_drawdown==="number"&&rg.max_drawdown<-25)
    f.push("Caída máxima de "+fmt(rg.max_drawdown,1)+"% en los últimos doce meses");
  if(typeof rd.vs_sp500_3m==="number"&&rd.vs_sp500_3m<0)
    f.push("Queda "+fmt(Math.abs(rd.vs_sp500_3m),1)+" puntos porcentuales por debajo del S&P 500 en tres meses");
  if(typeof fu.precio_objetivo==="number"&&typeof p==="number"&&fu.precio_objetivo<p)
    f.push("El precio cotiza por encima del objetivo de consenso ("+dol(fu.precio_objetivo)+")");
  if(!esETF&&!Object.keys(fu.señales||{}).length)
    f.push("Los datos fundamentales aún no están disponibles: la señal se apoya solo en técnico y riesgo");
  return f;
}

function veredicto(t,r){
  const tc=r.tecnico,fu=r.fundamental,rg=r.riesgo,nv=r.niveles||{},rd=r.rendimiento||{};
  const sc=r.compuesto.score_compuesto,señal=r.compuesto.señal,esETF=r.tipo==="etf";
  const p=tc.precio_actual;
  const segs=[["VENTA FUERTE","#3d0c14",ROJO,1.5],["VENTA","#2a0c10",ROJO,1],
              ["MANTENER / OBSERVAR","#1e2010","#b0c060",1.2],["COMPRA","#0e2a1e",VERDE,1],["COMPRA FUERTE","#040e06",VERDE,1.5]];
  let track='<div class="rtrack">';
  segs.forEach(([n,bg,col,fl])=>{
    const act=n===señal;
    track+='<div class="rseg'+(act?' r-active':'')+'" style="flex:'+fl+';background:'+bg+';color:'+col+';opacity:'+(act?1:.4)+'">'+n+'</div>';
  });
  track+='</div>';
  const stopPct=(typeof p==="number"&&typeof nv.s2==="number")?(nv.s2/p-1)*100:null;
  const vecesATR=(typeof stopPct==="number"&&rg.atr_relativo)?Math.abs(stopPct)/rg.atr_relativo:null;

  let txt='<b>Señal: '+esc(señal)+', con score compuesto de '+(sc>=0?"+":"")+sc+' sobre ±100.</b> ';
  if(esETF){
    txt+='Al tratarse de un fondo cotizado, la lectura combina solo dos bloques: el técnico aporta '+tc.score_tecnico+
      '/4 y el riesgo penaliza con '+fmt(rg.score_riesgo,1)+'/100 ('+rg.nivel_riesgo.toLowerCase()+'). ';
  }else{
    txt+='La lectura combina tres bloques: el técnico aporta '+tc.score_tecnico+'/4 (tendencia '+
      ((tc.señales||{}).tendencia>=0?"+":"")+(tc.señales||{}).tendencia+', momentum '+
      ((tc.señales||{}).momentum>=0?"+":"")+(tc.señales||{}).momentum+', timing '+
      ((tc.señales||{}).timing>=0?"+":"")+(tc.señales||{}).timing+'), el fundamental '+fu.score_fundamental+'/6, ';
    txt+='y el riesgo penaliza con '+fmt(rg.score_riesgo,1)+'/100 ('+rg.nivel_riesgo.toLowerCase()+'). ';
  }
  txt+=(typeof rd.vs_sp500_3m==="number"?
    (rd.vs_sp500_3m>0?'Frente al mercado, supera al S&P 500 en '+fmt(rd.vs_sp500_3m,1)+' pp a tres meses. ':
     'Frente al mercado, queda '+fmt(Math.abs(rd.vs_sp500_3m),1)+' pp por debajo del S&P 500 a tres meses. '):'');
  txt+='<br><br>';

  if(señal.includes("COMPRA")&&typeof nv.s1==="number"&&typeof p==="number"){
    txt+='<b>Zona de acumulación técnica: '+dol(nv.s1)+' – '+dol(p)+'</b>, entre el soporte de 20 días y el precio actual. ';
    if(typeof nv.s2==="number"){
      txt+='Un retroceso hacia el soporte de 60 días ('+dol(nv.s2)+') invalidaría la estructura alcista de corto plazo. ';
      txt+='<b>Referencia de stop: cierre sostenido por debajo de '+dol(nv.s2)+'</b>'+
        (typeof stopPct==="number"?', equivalente a '+fmt(stopPct,1)+'% desde el nivel actual':'')+
        (vecesATR?' y aproximadamente '+fmt(vecesATR,1)+' veces el ATR diario':'')+'. ';
    }
  }else if(señal.includes("VENTA")&&typeof nv.r1==="number"){
    txt+='<b>Resistencia inmediata en '+dol(nv.r1)+'</b> (máximo de 20 días). Una recuperación sostenida por encima de ese nivel ';
    txt+='invalidaría la lectura bajista de corto plazo.';
  }else{
    txt+='Sin señal direccional clara: el rango operativo se ubica entre '+dol(nv.s1)+' y '+dol(nv.r1)+
      '. Conviene esperar una definición de la estructura antes de tomar posición.';
  }
  txt+='<br><br>';

  if(esETF){
    txt+='<b>Recuerda que un ETF replica una canasta:</b> su comportamiento depende del índice o sector que sigue, no de una tesis '+
      'sobre una empresa en particular.';
    if(r.etf&&typeof r.etf.costo_anual==="number")
      txt+=' El costo anual de '+pc1(r.etf.costo_anual)+' se descuenta del rendimiento año con año.';
  }else{
    const caro=typeof fu.pe_relativo_sector==="number"?fu.pe_relativo_sector>1.30:(typeof fu.pe==="number"&&fu.pe>35);
    const calidad=typeof fu.margen_operativo==="number"&&fu.margen_operativo>0.2;
    if(caro&&calidad) txt+='<b>La tensión central de esta emisora es entre calidad operativa y precio pagado:</b> los fundamentales son sólidos, pero el múltiplo no deja margen de error. ';
    else if(!caro&&calidad) txt+='<b>La combinación de rentabilidad alta con múltiplo contenido frente a sus pares</b> es el argumento cuantitativo más fuerte de esta emisora. ';
    else if(caro&&!calidad) txt+='<b>El múltiplo exigente no está respaldado por la rentabilidad actual.</b> ';
    if(rg.volatilidad_anualizada>40) txt+='Dado el perfil de volatilidad ('+fmt(rg.volatilidad_anualizada,1)+'% anual), el dimensionamiento de la posición importa más que la decisión de entrada.';
  }

  return '<div class="vb"><h3>Calificación Ajustada por Riesgo</h3>'+track+
    '<div class="niv">'+
    nivc("SOPORTE 2 · MÍN 60D",nv.s2,ROJO)+nivc("SOPORTE 1 · MÍN 20D",nv.s1,ROJO)+
    nivc("RESISTENCIA 1 · MÁX 20D",nv.r1,VERDE)+nivc("MÁX 52 SEMANAS",nv.max52,VERDE)+
    '</div><div class="vt">'+txt+'</div></div>';
}
function nivc(l,v,col){
  return '<div class="nivc"><div class="ev" style="color:'+col+'">'+dol(v)+'</div><div class="el">'+l+'</div></div>';
}

pintarFrase();
cargar();
</script>
