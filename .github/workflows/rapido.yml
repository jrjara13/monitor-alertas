name: Watchlist Rápido

on:
  schedule:
    # Cada 5 min en horario de mercado NYSE (7:30am-2pm hora Monterrey).
    - cron: "*/5 13-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Mismo grupo que el workflow principal: nunca despliegan a la vez.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  rapido:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy

      # Solo lectura: el cache lo escribe el workflow principal.
      - name: Restaurar cache de fundamentales
        uses: actions/cache/restore@v4
        with:
          path: docs/fundamentales.json
          key: fundamentales-restaurar
          restore-keys: |
            fundamentales-

      - name: Actualizar watchlist
        run: python3 rapido.py

      - name: Recuperar alertas.json ya publicado
        run: |
          URL="https://jrjara13.github.io/monitor-alertas/alertas.json"
          if curl -fsSL --max-time 60 "$URL" -o /tmp/alertas.json \
             && python3 -c "import json;json.load(open('/tmp/alertas.json'))"; then
            cp /tmp/alertas.json docs/alertas.json
            echo "alertas.json recuperado del sitio publicado."
          else
            echo "ERROR: no se pudo recuperar alertas.json."
            echo "Se cancela el despliegue para no publicar un sitio incompleto."
            exit 1
          fi

      - name: Preparar sitio
        run: |
          rm -rf _site && mkdir -p _site
          cp docs/monitor.html _site/index.html
          cp docs/monitor.html _site/monitor.html
          cp docs/alertas.json _site/
          if [ -f docs/rapido.json ]; then cp docs/rapido.json _site/; fi
          touch _site/.nojekyll
          echo "--- contenido publicado ---"
          ls -la _site

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
