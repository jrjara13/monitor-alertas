name: Watchlist Rápido

on:
  schedule:
    # Cada 5 min durante horario de mercado NYSE (9:30am-4pm hora NY
    # = 7:30am-2pm hora Monterrey). En UTC: 13:30-20:00.
    # Nota: GitHub Actions no garantiza puntualidad en tareas programadas;
    # con carga alta puede retrasarse varios minutos o saltarse una corrida.
    - cron: "*/5 13-20 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: watchlist-rapido
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rapido:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy

      - name: Actualizar watchlist
        run: python3 rapido.py

      - name: Publicar rapido.json
        run: |
          git config user.name "Motor de Alertas"
          git config user.email "actions@github.com"
          git add docs/rapido.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Watchlist $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Reintento $i..."
            sleep 5
          done
          echo "No se pudo publicar tras 3 intentos."
          exit 1
