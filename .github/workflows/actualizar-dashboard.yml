name: Actualizar Dashboard de Alertas

on:
  schedule:
    # Cada 30 min durante horario de mercado NYSE (9:30am-4pm hora NY
    # = 7:30am-2pm hora Monterrey, que no cambia a horario de verano).
    # En UTC eso es 13:30-20:00.
    - cron: "0,30 13-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy lxml

      - name: Correr el motor de alertas
        run: python3 main.py

      - name: Publicar cambios (docs/)
        run: |
          git config user.name "Motor de Alertas"
          git config user.email "actions@github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Actualiza dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
