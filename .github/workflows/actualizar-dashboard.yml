name: Actualizar Dashboard de Alertas

on:
  schedule:
    # Cada 30 min en horario de mercado NYSE (7:30am-2pm hora Monterrey).
    - cron: "0,30 13-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy lxml requests

      - name: Restaurar cache de fundamentales
        uses: actions/cache/restore@v4
        with:
          path: docs/fundamentales.json
          key: fundamentales-restaurar
          restore-keys: |
            fundamentales-

      - name: Restaurar universo
        uses: actions/cache/restore@v4
        with:
          path: docs/universo.json
          key: universo-restaurar
          restore-keys: |
            universo-

      # Estado previo de las señales, para detectar cambios.
      - name: Restaurar estado de señales
        uses: actions/cache/restore@v4
        with:
          path: docs/estado_senales.json
          key: senales-restaurar
          restore-keys: |
            senales-

      - name: Verificar universo
        run: |
          if [ -f docs/universo.json ]; then
            python3 -c "
          import json
          u=json.load(open('docs/universo.json'))
          print('Universo encontrado:',u.get('total'),'emisoras')
          "
          else
            echo "AVISO: no hay universo.json en cache; se usara la lista de respaldo."
          fi

      - name: Correr el motor de alertas
        run: python3 main.py

      - name: Guardar cache de fundamentales
        uses: actions/cache/save@v4
        if: always()
        with:
          path: docs/fundamentales.json
          key: fundamentales-${{ github.run_id }}

      # Manda a Telegram solo los cambios de señal.
      - name: Enviar alertas a Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 alertas_telegram.py

      - name: Guardar estado de señales
        uses: actions/cache/save@v4
        if: always()
        with:
          path: docs/estado_senales.json
          key: senales-${{ github.run_id }}

      - name: Recuperar rapido.json ya publicado
        run: |
          URL="https://jrjara13.github.io/monitor-alertas/rapido.json"
          if curl -fsSL --max-time 30 "$URL" -o /tmp/rapido.json \
             && python3 -c "import json;json.load(open('/tmp/rapido.json'))"; then
            cp /tmp/rapido.json docs/rapido.json
            echo "rapido.json recuperado del sitio publicado."
          else
            echo "No se pudo recuperar rapido.json; se continua sin el."
          fi

      - name: Preparar sitio
        run: |
          rm -rf _site && mkdir -p _site
          cp docs/monitor.html _site/index.html
          cp docs/monitor.html _site/monitor.html
          if [ -f docs/alertas.json ]; then cp docs/alertas.json _site/; fi
          if [ -f docs/rapido.json ]; then cp docs/rapido.json _site/; fi
          touch _site/.nojekyll
          ls -la _site

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
