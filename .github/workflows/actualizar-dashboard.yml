name: Actualizar Dashboard de Alertas

on:
  schedule:
    # Corre a las 09:00 y 15:00 hora de México (UTC-6) en días hábiles.
    # GitHub Actions usa UTC, por eso 15:00 y 21:00 UTC.
    - cron: "0 15 * * 1-5"
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}   # te deja correrlo manualmente desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy

      - name: Correr el motor de alertas
        run: python3 main.py

      - name: Publicar cambios (docs/)
        run: |
          git config user.name "Motor de Alertas"
          git config user.email "actions@github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Actualiza dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
